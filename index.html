              <td style="font-size:0.65rem;color:var(--text-muted);white-space:nowrap">${r.area}</td>
              <td><strong>${r.rest}</strong></td>
              <td>${fmtD(r.para)}</td>
              <td><span class="prod-name">${r.name}</span></td>
              <td style="font-weight:700;color:var(--success)">${r.qty}</td>
              <td style="font-size:0.75rem;color:#0369a1">${r.lote ? fmtD(r.lote) : '—'}</td>
              <td style="font-weight:600;font-size:0.8rem">${r.tempSalida != null && r.tempSalida !== '' ? r.tempSalida : '—'}</td>
              <td style="font-weight:600;font-size:0.8rem">${r.tempRecepcion != null && r.tempRecepcion !== '' ? r.tempRecepcion : '—'}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function fmtTempCSV(v){
  if(v == null || v === '') return '';
  if(String(v).toLowerCase() === 'ambiente') return 'Ambiente';
  const n = Number(v);
  if(Number.isNaN(n)) return String(v).replaceAll('"','""');
  return String(Math.round(n * 10) / 10).replace('.', ',');
}
function orderInDateRange(o, from, to){
  const d = o.deliveryDate || '';
  if(!d) return false;
  if(from && d < from) return false;
  if(to && d > to) return false;
  return true;
}
function mesNombreES(ym){
  const meses = ['','ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  const m = parseInt((ym||'').split('-')[1], 10);
  return meses[m] || '';
}
function buildExpedicionCSV(orders){
  // Formato compatible con historial Excel: pegar al final
  let csv = 'AÑO;MES;AREA;FECHA EXP;RESTAURANTE;PREPARACIONES;LOTE;QTY;SALIDA;RECEPCION;RESPONSABLE\n';
  let lines = 0;
  orders.forEach(o=>{
    const fechaExp = o.deliveryDate || '';
    const anio = fechaExp ? fechaExp.slice(0,4) : '';
    const mes = fechaExp ? mesNombreES(fechaExp) : '';
    o.items.forEach(it=>{
      if(skipAPPCC(it)) return;
      if(!itemMatchesProduct(it, state.dlProdSearch)) return;
      const poz = isAutoLote(it);
      const qtyVal = Number(poz ? it.qty : (it.dispatchedQty || 0));
      if(qtyVal <= 0) return;
      const loteVal = poz ? fmtD(o.deliveryDate) : (it.lote ? fmtD(it.lote) : '');
      const area = getProductArea(it.name, it.area);
      const ts = fmtTempCSV(it.tempSalida);
      const tr = fmtTempCSV(it.tempRecepcion);
      const prod = String(it.name||'').replace(/"/g,'""');
      csv += anio+';'+mes+';'+area+';'+fmtD(fechaExp)+';'+o.rest+';"'+prod+'";'+loteVal+';'+qtyVal+';'+ts+';'+tr+';TRANSPORTE\n';
      lines++;
    });
  });
  return {csv, lines};
}
function downloadCSVFile(csv, filename){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}



function isAlcachofaItem(it){
  return !!(it && (it.name||'').toLowerCase().includes('alcachofa'));
}
function alcachofaTipo(name){
  const n = (name||'').toLowerCase();
  if(n.includes('flor')) return 'FLOR';
  if(n.includes('fondo')) return 'FONDO';
  return 'OTRO';
}
function alcachofaPesoBandeja(name){
  const tipo = alcachofaTipo(name);
  if(tipo === 'FLOR') return 1.25;
  if(tipo === 'FONDO') return 0.75;
  return 0;
}
function fmtKg(n){
  const x = Math.round(Number(n)*100)/100;
  return String(x).replace('.', ',');
}

function exportOtrosCSV(){
  const detailRows = [];
  const resumen = {};
  state.orders.forEach(o => {
    if(state.dlRest && o.rest !== state.dlRest) return;
    if(!matchesDateFilter(o.deliveryDate, state.dlFrom, state.dlTo)) return;
    (o.items||[]).forEach(it => {
      if(!isAlcachofaItem(it)) return;
      if(!itemMatchesProduct(it, state.dlProdSearch)) return;
      const q = o.status === 'Despachado'
        ? (Number(it.dispatchedQty != null ? it.dispatchedQty : it.qty)||0)
        : Number(it.qty)||0;
      if(q <= 0) return;
      const tipo = alcachofaTipo(it.name);
      const peso = alcachofaPesoBandeja(it.name);
      const kg = Math.round(q * peso * 100) / 100;
      detailRows.push({
        fecha: fmtD(o.deliveryDate),
        rest: o.rest,
        tipo, q, peso, kg
      });
      if(!resumen[o.rest]) resumen[o.rest] = { FLOR:{qty:0,kg:0}, FONDO:{qty:0,kg:0}, OTRO:{qty:0,kg:0} };
      const bucket = resumen[o.rest][tipo] || resumen[o.rest].OTRO;
      bucket.qty += q;
      bucket.kg += kg;
    });
  });
  if(detailRows.length === 0){ alert('No hay alcachofas en pantalla.'); return; }

  const summaryRows = [];
  Object.keys(resumen).sort((a,b)=>a.localeCompare(b,'es')).forEach(rest => {
    const r = resumen[rest];
    ['FLOR','FONDO'].forEach(tipo => {
      const b = r[tipo];
      if(!b || (b.qty <= 0 && b.kg <= 0)) return;
      summaryRows.push({
        rest, tipo, q: b.qty, kg: Math.round(b.kg * 100) / 100
      });
    });
  });

  // A-F detalle | G vacía | H-K resumen
  let csv = 'DETALLE PEDIDOS;;;;;;;RESUMEN X TIPO;;;\n';
  csv += 'Fecha;Restaurante;Tipo;Cantidad;Peso bandeja;KG;;Restaurante;Tipo;Cantidad;KG\n';
  const n = Math.max(detailRows.length, summaryRows.length);
  for(let i=0;i<n;i++){
    let left = ';;;;;;;';
    if(i < detailRows.length){
      const d = detailRows[i];
      left = `${d.fecha};${d.rest};${d.tipo};${d.q};${fmtKg(d.peso)};${fmtKg(d.kg)};;`;
    }
    let right = '';
    if(i < summaryRows.length){
      const s = summaryRows[i];
      right = `${s.rest};${s.tipo};${s.q};${fmtKg(s.kg)}`;
    }
    csv += left + right + '\n';
  }

  const stamp = new Date().toISOString().slice(0,10);
  downloadCSVFile(csv, 'ALCACHOFAS_'+stamp+'.csv');
  state.successMessage = 'CSV Alcachofas listo para enviar (detalle + resumen al costado).';
  render();
}

function exportCSVRange(){
  const matched = state.orders.filter(o => o.status==='Despachado' && (!state.dlRest || o.rest === state.dlRest) && matchesDateFilter(o.deliveryDate, state.dlFrom, state.dlTo));
  if(matched.length === 0){
    alert('No hay despachos en pantalla para exportar.');
    return;
  }
  const {csv, lines} = buildExpedicionCSV(matched);
  if(lines === 0){
    alert('No hay líneas de expedición para exportar.');
    return;
  }
  const ok = confirm(
    'Se van a descargar '+lines+' línea(s) de '+matched.length+' pedido(s) (todo lo visible).\n\n'+
    'Después se ELIMINARÁN de la app (quedan solo en el CSV).\n\n¿Continuar?'
  );
  if(!ok) return;

  const stamp = new Date().toISOString().slice(0,10);
  downloadCSVFile(csv, 'APPCC_'+stamp+'.csv');

  const ids = new Set(matched.map(o => o.id));
  state.orders = state.orders.filter(o => !ids.has(o.id));
  saveState();
  state.successMessage = 'Exportados '+lines+' registros (lo visible). Eliminados de la app.';
  render();
}

document.addEventListener('change', function(e){
  const el = e.target;
  if(!el || el.type !== 'date' || !el.value) return;
  // Solo corrige cuando la fecha está completa (YYYY-MM-DD)
  const m = el.value.match(/^(\d+)-(\d{2})-(\d{2})$/);
  if(!m) return;
  let y = m[1];
  if(y.length > 4) y = y.slice(0, 4);
  const yi = parseInt(y, 10);
  if(yi > 2099) y = '2099';
  if(y !== m[1]) el.value = y + '-' + m[2] + '-' + m[3];
});

function restoreProdSearchFocus(){
  const map = [
    ['rest-prod-search', 'restProdSearch'],
    ['tr-prod-search', 'transportProdSearch'],
    ['hel-prod-search', 'heladeriaProdSearch'],
    ['dl-prod-search', 'dlProdSearch']
  ];
  for(const [id, key] of map){
    const el = document.getElementById(id);
    if(el && document.activeElement === el) return;
  }
  // if we just typed, re-focus the field that exists
  for(const [id] of map){
    const el = document.getElementById(id);
    if(el && el.value){
      el.focus();
      try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){}
      break;
    }
  }
}
const _render0 = render;
render = function(){
  let activeId = null;
  let selStart = null;
  let selEnd = null;
  const ae = document.activeElement;
  if(ae && ae.id && (ae.id==='rest-prod-search'||ae.id==='tr-prod-search'||ae.id==='hel-prod-search'||ae.id==='dl-prod-search')){
    activeId = ae.id;
    try{ selStart = ae.selectionStart; selEnd = ae.selectionEnd; }catch(e){}
  }
  _render0();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      try{ if(selStart!=null) el.setSelectionRange(selStart, selEnd); }catch(e){}
    }
  }
};

// Marca casilleros de lote en gris al cargar fecha
document.addEventListener('change', function(e){
  const el = e.target;
  if(!el || el.type !== 'date') return;
  if(!el.id || el.id.indexOf('glote-') !== 0) return;
  if(el.disabled){ el.classList.add('lote-filled'); return; }
  el.classList.toggle('lote-filled', !!el.value);
}, true);

initSync().then(function(){ render(); });
