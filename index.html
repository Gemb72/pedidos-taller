function renderRestaurantes(){
  const rests=Object.keys(RESTAURANTS_CONFIG);
  if(state.selRest && !rests.includes(state.selRest)) state.selRest='';

  if(!state.authRest){
    app.innerHTML=`
    <div class="nav-header">
      <button class="btn-back" onclick="navigateTo('HOME')">← Salir</button>
      <h2>Módulo Restaurantes</h2>
    </div>
    <div class="order-card" style="max-width:400px;margin:0 auto">
      <h3 style="margin-bottom:0.75rem;text-align:center;font-size:0.9rem;text-transform:uppercase">Acceso Restaurantes</h3>
      <label>Selecciona Restaurante</label>
      <div class="rest-grid-select">
        ${rests.map(r=>`<div class="btn-rest-option ${state.selRest===r?'selected':''}" onclick="state.selRest='${r}';state.activeTab='COCINA';state.restSubTab='PEDIDO';state.restOrderPanel='CATALOGO';render()">${r}</div>`).join('')}
      </div>
      <div class="form-group">
        <label>PIN de Acceso</label>
        <input type="password" id="login-pin" placeholder="Ingrese PIN" onkeydown="if(event.key==='Enter')loginRest()">
      </div>
      <button class="btn" style="width:100%" onclick="loginRest()">Acceder</button>
    </div>`;return;
  }

  if(!state.selRest || !RESTAURANTS_CONFIG[state.selRest]){
    state.authRest=false;
    render();
    return;
  }
  const cfg=RESTAURANTS_CONFIG[state.selRest];
  const tabs=catalogTabs(cfg);
  if(!tabs.includes(state.activeTab) || !state.activeTab) state.activeTab = tabs.includes('COCINA') ? 'COCINA' : (tabs[0]||'COCINA');
  const isOtrosTab = state.activeTab==='OTROS';
  const q = (state.searchQuery||'').trim().toLowerCase();
  const searching = q.length > 0;
  let globalHits = [];
  if(searching){
    Object.keys(cfg.catalog||{}).forEach(tab => {
      (cfg.catalog[tab]||[]).forEach(name => {
        if(name.toLowerCase().includes(q)){
          globalHits.push({name, tab, area: tabToItemArea(tab)});
        }
      });
    });
    globalHits.sort((a,b)=>nombreCorto(a.name,a.area).localeCompare(nombreCorto(b.name,b.area),'es',{sensitivity:'base'}));
  }
  const cat = isOtrosTab ? (cfg.catalog.OTROS||[]) : (cfg.catalog[state.activeTab]||[]);
  const areaSort = tabToItemArea(state.activeTab);
  const items = searching ? [] : [...cat].sort((a,b)=>nombreCorto(a,areaSort).localeCompare(nombreCorto(b,areaSort),'es',{sensitivity:'base'}));
  let myOrders = sortNewestFirst(state.orders.filter(o => o.rest === state.selRest && (o.status==='Pendiente' || isRecentOrder(o))));
  if(state.restSubTab === 'HISTORIAL'){
    myOrders = myOrders.filter(o => matchesDateFilter(o.deliveryDate, state.restHistFrom, state.restHistTo) && orderHasProduct(o, state.restProdSearch));
  }
  const cartCount = (state.cart||[]).reduce((s,i)=>s+(Number(i.qty)||0),0);
  const cartLines = (state.cart||[]).length;
  if(state.restSubTab!=='PEDIDO') state.restOrderPanel = 'CATALOGO';

  app.innerHTML=`
  <div class="nav-header">
    <button class="btn-back" onclick="navigateTo('HOME')">← Salir</button>
    <div><strong>${state.selRest}</strong></div>
  </div>
  ${state.successMessage?`<div class="success-message"><div><strong>✓ Pedido realizado con éxito</strong><br>${state.successMessage}</div><button class="success-close" onclick="state.successMessage='';render()">×</button></div>`:''}

  <div class="module-tabs">
    <button class="module-tab-btn ${state.restSubTab==='PEDIDO'?'active':''}" onclick="state.restSubTab='PEDIDO';render()">Nuevo Pedido</button>
    <button class="module-tab-btn ${state.restSubTab==='HISTORIAL'?'active':''}" onclick="state.restSubTab='HISTORIAL';render()">Mis Pedidos (${myOrders.length})</button>
  </div>

  ${state.restSubTab==='HISTORIAL' ? `
    <p style="font-size:0.72rem;color:var(--text-muted);margin:0 0 0.55rem">Solo se muestran los últimos ${HISTORIAL_DAYS} días.</p>
    <div class="order-card" style="margin-bottom:0.75rem;padding:0.75rem">
      <div class="section-title" style="margin-bottom:0.5rem">Filtro de búsqueda</div>
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:flex-end">
        <div class="form-group" style="margin:0"><label style="font-size:0.7rem">Desde</label><input type="date" max="2099-12-31" value="${state.restHistFrom||''}" onchange="state.restHistFrom=this.value;render()" style="padding:0.35rem"></div>
        <div class="form-group" style="margin:0"><label style="font-size:0.7rem">Hasta</label><input type="date" max="2099-12-31" value="${state.restHistTo||''}" onchange="state.restHistTo=this.value;render()" style="padding:0.35rem"></div>
        <div class="form-group" style="margin:0;min-width:160px;max-width:240px"><label style="font-size:0.7rem">Producto</label><div style="display:flex;gap:0.25rem;align-items:center"><input type="text" id="rest-prod-search" placeholder="ej. vinagreta" value="${(state.restProdSearch||'').replace(/"/g,'&quot;')}" oninput="state.restProdSearch=this.value;render()" style="padding:0.35rem;width:100%;border:1px solid var(--border);border-radius:4px"><button type="button" class="btn-back" style="padding:0.25rem 0.45rem" onclick="state.restProdSearch='';render()" title="Limpiar">×</button></div></div>
        <button type="button" class="btn-back" onclick="state.restProdSearch='';state.restHistFrom='';state.restHistTo='';render()">Limpiar</button>
      </div>
    </div>
    ${myOrders.length===0?`<div class="order-card"><p style="color:var(--text-muted);font-size:0.8rem">Aún no has realizado ningún pedido.</p></div>`:''}
    ${myOrders.map(o=>{
      const stLabel = o.status==='Despachado'?'Enviado':(o.status==='Pendiente'?'Pedido':(o.status==='Anulado'?'Anulado':o.status));
      const stStyle = o.status==='Pendiente'?'background:#fef3c7;color:#92400e;border-color:#fde68a':(o.status==='Anulado'?'background:#f1f5f9;color:#64748b;border-color:#cbd5e1':'');
      const border = o.status==='Despachado'?'border-left:4px solid var(--success)':(o.status==='Anulado'?'border-left:4px solid #94a3b8;opacity:0.85':'');
      return `
      <div class="order-card" style="${border}">
        <div class="order-header">
          <div class="order-top-line">
            <div class="order-rest">Para: ${fmtD(o.deliveryDate)}${o.planta? ' · '+o.planta : ''}</div>
            <div class="order-code" style="${stStyle}">${stLabel}</div>
          </div>
          <div class="order-received">Enviado: ${fmtDT(o.receivedDate)||'—'}</div>
        </div>
        <table class="table-module">
          <thead><tr><th>Producto</th><th>Cant.</th><th>Área</th>${o.status==='Despachado'?'<th>Enviado</th><th>Lote</th>':''}</tr></thead>
          <tbody>
            ${o.items.filter(it=>itemMatchesProduct(it, state.restProdSearch)).map(it=>{
              const poz = isAutoLote(it);
              const disp = poz ? it.qty : (it.dispatchedQty!=null?it.dispatchedQty:'—');
              const lote = poz ? o.deliveryDate : (it.lote||'—');
              return `<tr>
                <td><span class="prod-name">${it.name}</span></td>
                <td><span class="qty-badge">${it.qty}</span></td>
                <td style="font-size:0.7rem;color:var(--text-muted)">${it.area||''}</td>
                ${o.status==='Despachado'?`<td><span class="qty-badge" style="background:#e2e8f0">${disp}</span></td>
                <td style="font-size:0.75rem;color:#0369a1">${lote && lote!=='No válido' ? fmtD(lote) : (lote||'—')}</td>`:''}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        ${o.status==='Pendiente'?`<div style="display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap">
          <button type="button" class="btn-back" style="flex:1;min-width:120px;color:#1e40af;border-color:#bfdbfe;background:#eff6ff" onclick="editRestOrder('${o.id}')">Modificar</button>
          <button type="button" class="btn-back" style="flex:1;min-width:120px;color:#b91c1c;border-color:#fecaca;background:#fef2f2" onclick="cancelRestOrder('${o.id}')">Anular pedido</button>
        </div>`:''}
      </div>`;
    }).join('')}
  ` : `
  <div>
  <div class="module-tabs" style="margin-bottom:0.65rem">
    <button class="module-tab-btn ${state.restOrderPanel!=='PRECHECK'?'active':''}" onclick="state.restOrderPanel='CATALOGO';render()">Catálogo</button>
    <button class="module-tab-btn ${state.restOrderPanel==='PRECHECK'?'active':''} ${cartCount>0?'tab-confirm':''}" onclick="state.restOrderPanel='PRECHECK';render()">${state.editingOrderId?(cartCount>0?`GUARDAR CAMBIOS (${cartCount})`:'Modificando…'):(cartCount>0?`CONFIRMAR Y ENVIAR (${cartCount})`:'Pre-check')}</button>
  </div>
  ${state.editingOrderId?`<p style="font-size:0.75rem;color:#1e40af;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:0.45rem 0.6rem;margin:0 0 0.55rem">Modificando pedido <strong>${state.editingOrderId}</strong>. Podés agregar, quitar o cambiar cantidades. <button type="button" class="btn-back" style="margin-left:0.35rem;padding:0.15rem 0.45rem" onclick="state.editingOrderId='';state.cart=[];state.deliveryDate='';state.metropolisPlanta='';state.restOrderPanel='CATALOGO';render()">Cancelar edición</button></p>`:''}
  ${state.restOrderPanel==='PRECHECK' ? `
    <div class="order-card">
            <div class="section-title">${state.editingOrderId?'Modificar pedido':'Resumen del pedido'}</div>
      <div style="display:flex;flex-wrap:nowrap;gap:0.45rem;align-items:flex-end;margin-bottom:0.75rem">
        <div class="form-group" style="margin:0;flex:0 0 auto">
          <label>Fecha de entrega</label>
          <input type="date" max="2099-12-31" value="${state.deliveryDate}" onchange="state.deliveryDate=this.value;persistRestDraft()" style="width:150px;max-width:150px">
        </div>
        ${state.cart.length>0?`<button class="btn-confirm" style="width:auto;margin:0 0 0 0;min-height:34px;height:34px;padding:0.3rem 0.75rem;white-space:nowrap;flex:0 0 auto" onclick="submitRestOrder()">${state.editingOrderId?'Guardar cambios':'Enviar pedido'}</button>`:''}
      </div>
      ${state.selRest==='METROPOLIS' ? `<div class="form-group">
        <label>Planta</label>
        <select onchange="state.metropolisPlanta=this.value;persistRestDraft()">
          <option value="" ${!state.metropolisPlanta?'selected':''}>Elegir planta...</option>
          ${[0,1,2].map(n=>`<option value="Planta ${n}" ${state.metropolisPlanta==='Planta '+n?'selected':''}>Planta ${n}</option>`).join('')}
        </select>
      </div>` : ''}
      ${state.cart.length===0?`<p style="font-size:0.78rem;color:var(--text-muted)">No hay productos cargados. Volvé al catálogo para sumar ítems.</p>`:''}
      ${state.cart.map(i=>{
        const safe=String(i.name).replace(/'/g,"\'");
        const area=String(i.area||'').replace(/'/g,"\'");
        return `<div class="cart-item-row"><div class="cart-item-info"><span class="cart-item-name">${nombreCorto(i.name,i.area)}</span><span class="cart-item-area">${i.area||''}</span></div><div style="display:flex;align-items:center;gap:0.35rem"><div class="qty-controls"><button type="button" onclick="updateCartItem('${safe}','${area}',-1)">-</button><input type="number" min="0" inputmode="numeric" pattern="[0-9]*" value="${i.qty}" onfocus="this.select()" onchange="setCartQty('${safe}','${area}',this.value)" onblur="setCartQty('${safe}','${area}',this.value)"><button type="button" onclick="updateCartItem('${safe}','${area}',1)">+</button></div><button class="btn-remove-item" onclick="removeFromCart('${safe}','${area}')" title="Quitar">×</button></div></div>`;
      }).join('')}
      <button type="button" class="btn-back" style="margin-top:0.5rem;width:100%" onclick="state.restOrderPanel='CATALOGO';render()">← Volver al catálogo</button>
    </div>
  ` : `
    <div class="order-card">
      <div style="display:flex;gap:0.4rem;align-items:center;margin-bottom:0.55rem">
        <input type="text" data-search="catalog" placeholder="Buscar en todas las categorías..." value="${state.searchQuery}" oninput="onCatalogSearch(this)" style="flex:1;margin:0">
        ${state.searchQuery?`<button type="button" class="btn-back" onclick="state.searchQuery='';render()" title="Limpiar">×</button>`:''}
      </div>
      ${searching ? `
        <p style="font-size:0.68rem;color:var(--text-muted);margin:0 0 0.4rem">${globalHits.length} resultado(s)</p>
        <div class="rest-catalog-scroll">
        ${globalHits.length===0?`<p style="color:var(--text-muted);font-size:0.75rem;padding:0.35rem 0">Sin coincidencias.</p>`:''}
        ${globalHits.map(h=>{const ci=state.cart.find(c=>c.name===h.name&&c.area===h.area);const qty=ci?ci.qty:0;const safe=h.name.replace(/'/g,"\\'");const label=nombreCorto(h.name,h.area);return`<div class="catalog-item"><div style="min-width:0"><span>${label}</span><div style="font-size:0.62rem;color:var(--text-muted);text-transform:uppercase;font-weight:700">${tabLabel(h.tab)}</div></div><div class="qty-controls"><button type="button" onclick="state.activeTab='${h.tab}';updateCart('${safe}', -1)">-</button><input type="number" min="0" inputmode="numeric" pattern="[0-9]*" value="${qty}" onfocus="this.select()" onchange="state.activeTab='${h.tab}';setCartQty('${safe}','${h.area}',this.value)"><button type="button" onclick="state.activeTab='${h.tab}';updateCart('${safe}', 1)">+</button></div></div>`;}).join('')}
        </div>
      ` : `
      <div class="tabs-sub">
        ${tabs.map(tb=>`<button class="${state.activeTab===tb?'active':''}" onclick="state.activeTab='${tb}';render()">${tabLabel(tb)}</button>`).join('')}
      </div>
      <div class="rest-catalog-scroll">
      ${isOtrosTab ? `
        ${[...(cfg.catalog.OTROS||[])].sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'})).map(item=>{const ci=state.cart.find(c=>c.name===item&&c.area==='OTROS');const qty=ci?ci.qty:0;const safe=item.replace(/'/g,"\\'");return`<div class="catalog-item"><span>${item}</span><div class="qty-controls"><button type="button" onclick="updateCartOtros('${safe}', -1)">-</button><input type="number" min="0" inputmode="numeric" pattern="[0-9]*" value="${qty}" onfocus="this.select()" onchange="setCartQtyOtros('${safe}',this.value)" onblur="setCartQtyOtros('${safe}',this.value)"><button type="button" onclick="updateCartOtros('${safe}', 1)">+</button></div></div>`;}).join('')}
        <div style="margin-top:${(cfg.catalog.OTROS||[]).length?'1rem':'0'};padding-top:${(cfg.catalog.OTROS||[]).length?'0.85rem':'0'};border-top:${(cfg.catalog.OTROS||[]).length?'1px dashed #cbd5e1':'none'}">
          <div style="font-size:0.7rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:0.45rem">Otras solicitudes</div>
          <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:0.55rem 0.6rem">
            <div class="qty-controls">
              <button type="button" onclick="(function(){var i=document.getElementById('otros-qty');var v=parseInt(i.value)||1;if(v>1)i.value=v-1;})()">-</button>
              <input type="number" id="otros-qty" min="1" value="1" inputmode="numeric" pattern="[0-9]*" onfocus="this.select()">
              <button type="button" onclick="(function(){var i=document.getElementById('otros-qty');i.value=(parseInt(i.value)||0)+1;})()">+</button>
            </div>
            <input type="text" id="otros-name" placeholder="escribe aquí" style="flex:1;min-width:140px;margin:0;border:none;background:transparent;outline:none" onkeydown="if(event.key==='Enter'){event.preventDefault();addOtrosItem();}">
            <button class="btn" onclick="addOtrosItem()" style="white-space:nowrap">＋</button>
          </div>
        </div>
      ` : `
        ${items.length===0?`<p style="color:var(--text-muted);font-size:0.75rem;padding:0.5rem 0">No hay productos disponibles en esta categoría.</p>`:''}
        ${items.map(item=>{const area=tabToItemArea(state.activeTab);const ci=state.cart.find(c=>c.name===item&&c.area===area);const qty=ci?ci.qty:0;const safe=item.replace(/'/g,"\\'");const label=nombreCorto(item,area);return`<div class="catalog-item"><span>${label}</span><div class="qty-controls"><button type="button" onclick="updateCart('${safe}', -1)">-</button><input type="number" min="0" inputmode="numeric" pattern="[0-9]*" value="${qty}" onfocus="this.select()" onchange="setCartQtyFromTab('${safe}',this.value)" onblur="setCartQtyFromTab('${safe}',this.value)"><button type="button" onclick="updateCart('${safe}', 1)">+</button></div></div>`;}).join('')}
      `}
      </div>
      `}
    </div>
  `}
</div>
  `}`;
}

function loginRest(){
  const pin=document.getElementById('login-pin').value;
  if(RESTAURANTS_CONFIG[state.selRest]&&RESTAURANTS_CONFIG[state.selRest].code===pin){state.authRest=true;state.cart=[];state.activeTab='COCINA';state.restSubTab='PEDIDO';state.restOrderPanel='CATALOGO';loadRestDraft(state.selRest);if(!state.activeTab||state.activeTab==='OTROS')state.activeTab='COCINA';render();}
  else{const inp=document.getElementById('login-pin');inp.value='';inp.placeholder='PIN incorrecto';inp.style.borderColor='var(--danger)';}
}

function restDraftKey(rest){ return 'restDraft_' + (rest || state.selRest || ''); }
function persistRestDraft(){
  try{
    const rest = state.selRest;
    if(!rest) return;
    const payload = {
      cart: state.cart || [],
      deliveryDate: state.deliveryDate || '',
      metropolisPlanta: state.metropolisPlanta || '',
      restOrderPanel: state.restOrderPanel || 'CATALOGO'
    };
    localStorage.setItem(restDraftKey(rest), JSON.stringify(payload));
  }catch(e){}
}
function loadRestDraft(rest){
  try{
    const raw = localStorage.getItem(restDraftKey(rest));
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d && Array.isArray(d.cart) && d.cart.length){
      state.cart = d.cart;
      state.deliveryDate = d.deliveryDate || state.deliveryDate || '';
      state.metropolisPlanta = d.metropolisPlanta || '';
      state.restOrderPanel = d.restOrderPanel || 'CATALOGO';
    }
  }catch(e){}
}
function clearRestDraft(rest){
  try{ localStorage.removeItem(restDraftKey(rest || state.selRest)); }catch(e){}
}

function updateCart(name,delta){
  saveRestScroll();
  const area=tabToItemArea(state.activeTab);
  let ci=state.cart.find(c=>c.name===name && c.area===area);
  if(!ci&&delta>0)state.cart.push({name,qty:delta,area});
  else if(ci){ci.qty+=delta;if(ci.qty<=0)state.cart=state.cart.filter(c=>!(c.name===name&&c.area===area));}
  persistRestDraft();
  render();
}
function onCatalogSearch(el){
  state.searchQuery = el.value;
  const pos = el.selectionStart != null ? el.selectionStart : el.value.length;
  render();
  requestAnimationFrame(()=>{
    const s = document.querySelector('input[data-search="catalog"]');
    if(s){
      s.focus();
      try { s.setSelectionRange(pos, pos); } catch(e){}
    }
  });
}
function updateCartOtros(name,delta){
  saveRestScroll();
  let ci=state.cart.find(c=>c.name===name && c.area==='OTROS');
  if(!ci&&delta>0)state.cart.push({name,qty:delta,area:'OTROS'});
  else if(ci){ci.qty+=delta;if(ci.qty<=0)state.cart=state.cart.filter(c=>!(c.name===name&&c.area==='OTROS'));}
  persistRestDraft();
  render();
}
function addOtrosItem(){
  saveRestScroll();
  const nameInp=document.getElementById('otros-name');
  const qtyInp=document.getElementById('otros-qty');
  const name=(nameInp&&nameInp.value||'').trim();
  let qty=parseInt(qtyInp&&qtyInp.value)||0;
  if(!name){if(nameInp){nameInp.style.borderColor='var(--danger)';nameInp.focus();}return;}
  if(qty<1) qty=1;
  const existing=state.cart.find(c=>c.area==='OTROS'&&c.name.toLowerCase()===name.toLowerCase());
  if(existing) existing.qty+=qty;
  else state.cart.push({name,qty,area:'OTROS'});
  persistRestDraft();
  render();
}
function updateCartItem(name, area, delta){
  saveRestScroll();
  let ci = state.cart.find(c => c.name === name && c.area === area);
  if(!ci && delta > 0) state.cart.push({name, qty: delta, area});
  else if(ci){
    ci.qty += delta;
    if(ci.qty <= 0) state.cart = state.cart.filter(c => !(c.name === name && c.area === area));
  }
  persistRestDraft();
  render();
}
function setCartQty(name, area, raw){
  saveRestScroll();
  let q = parseInt(raw, 10);
  if(isNaN(q) || q < 0) q = 0;
  let ci = state.cart.find(c => c.name === name && c.area === area);
  if(q <= 0){
    state.cart = state.cart.filter(c => !(c.name === name && c.area === area));
  } else if(ci){
    ci.qty = q;
  } else {
    state.cart.push({name, qty: q, area});
  }
  persistRestDraft();
  render();
}
function setCartQtyFromTab(name, raw){
  const area = tabToItemArea(state.activeTab);
  setCartQty(name, area, raw);
}
function setCartQtyOtros(name, raw){
  setCartQty(name, 'OTROS', raw);
}
function removeFromCart(name, area){
  saveRestScroll();
  if(area != null && area !== '') state.cart = state.cart.filter(c => !(c.name === name && c.area === area));
  else state.cart = state.cart.filter(c => c.name !== name);
  persistRestDraft();
  render();
}

function cancelRestOrder(orderId){
  const o = state.orders.find(x => x.id === orderId);
  if(!o) return;
  if(o.status !== 'Pendiente'){
    alert('Solo se pueden anular pedidos que aún no fueron despachados.');
    return;
  }
  if(!confirm('¿Anular este pedido?\nPara: ' + fmtD(o.deliveryDate) + '\nDejará de verse en transporte.')) return;
  o.status = 'Anulado';
  o.cancelledDate = new Date().toISOString();
  if(state.editingOrderId === orderId){
    state.editingOrderId = '';
    state.cart = [];
    state.deliveryDate = '';
    state.metropolisPlanta = '';
  }
  saveState();
  state.successMessage = 'Pedido anulado.';
  render();
}
function editRestOrder(orderId){
  const o = state.orders.find(x => x.id === orderId);
  if(!o) return;
  if(o.status !== 'Pendiente'){
    alert('Solo se pueden modificar pedidos que aún no fueron despachados.');
    return;
  }
  if(o.rest !== state.selRest){
    alert('Este pedido no es de este restaurante.');
    return;
  }

}
function submitRestOrder(){
  if(!state.deliveryDate){const d=document.querySelector('input[type="date"]');if(d){d.style.borderColor='var(--danger)';d.focus();}return;}
  if(!state.cart.length){
    alert('El pedido no tiene productos.');
    return;
  }
  if(state.selRest==='METROPOLIS' && !state.metropolisPlanta){
    alert('Elegí la planta.');
    return;
  }
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const received=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const items=[...state.cart.map(it=>({name:it.name,qty:Number(it.qty)||0,area:it.area||'COCINA'}))];

  // Modificar pedido pendiente existente
  if(state.editingOrderId){
    const o = state.orders.find(x => x.id === state.editingOrderId);
    if(!o || o.status !== 'Pendiente'){
      alert('Ese pedido ya no se puede modificar (quizá transporte lo despachó).');
      state.editingOrderId = '';
      return;
    }
    o.deliveryDate = state.deliveryDate;
    o.planta = state.selRest==='METROPOLIS' ? (state.metropolisPlanta||'') : (o.planta||'');
    o.items = items;
    o.receivedDate = received; // actualiza hora de última modificación
    o.modifiedDate = received;
    state.editingOrderId = '';
    state.cart=[];state.deliveryDate='';state.metropolisPlanta='';state.restOrderPanel='CATALOGO';
    clearRestDraft(state.selRest);saveState();
    state.authRest=true;
    state.restSubTab='HISTORIAL';
    state.successMessage=`Pedido modificado. ID: ${o.id}`;
    render();
    return;
  }

  const newOrder={
    id:'PED-'+Math.random().toString(36).substr(2,8).toUpperCase(),
    rest:state.selRest,deliveryDate:state.deliveryDate,
    planta: state.selRest==='METROPOLIS' ? (state.metropolisPlanta||'') : '',
    receivedDate:received,
    status:'Pendiente',items
  };
  state.orders.unshift(newOrder);state.cart=[];state.deliveryDate='';state.metropolisPlanta='';state.restOrderPanel='CATALOGO';clearRestDraft(state.selRest);saveState();
  state.authRest=true;
  state.successMessage=`ID: ${newOrder.id}`;
  render();
}

function normalizeName(s){
  return (s||'').toLowerCase().replace(/\s+/g,' ').trim();
}

function getDispatchStats(days){
  const rests = Object.keys(RESTAURANTS_CONFIG);
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - (Number(days)||120));
  const cutoffStr = cutoff.toISOString().slice(0,10);

  const stats = {}; // nameNorm -> { total, byRest: {rest: qty} }

  state.orders.filter(o => o.status === 'Despachado').forEach(o => {
    const d = o.deliveryDate || '';
    if(d < cutoffStr) return;
    o.items.forEach(it => {
      const poz = isAutoLote(it);
      const qty = Number(poz ? it.qty : (it.dispatchedQty || 0));
      if(qty <= 0) return;
      const key = normalizeName(it.name);
      if(!stats[key]) stats[key] = { total: 0, byRest: {} };
      stats[key].total += qty;
      stats[key].byRest[o.rest] = (stats[key].byRest[o.rest] || 0) + qty;
    });
  });
  return stats;
}

function getProductArea(name, itemArea){
  const key = normalizeName(name);
  const found = INVENTORY_MASTER.find(p => normalizeName(p.name) === key);
  if(found) return found.area;
  const n = (name||'').toLowerCase();
  if(itemArea === 'HELADOS' || n.includes('helado') || n.includes('sorbete') || n.includes('pozzetti') || n.includes('tupper')) return 'HELADERIA';
  if(itemArea === 'PANADERIA') return 'PANADERIA';
  if(n.includes('(c)') || n.includes('congel')) return 'CONGELADOR';
  return 'PREPARACION';
}

// Misma lógica que tu macro de Excel
const _tempByDatePoz = {};
const _tempByProductKey = {}; // misma temp si se dividió por lote
function generateTemperatures(name, rest, itemArea, deliveryDate){
  const area = getProductArea(name, itemArea);
  const n = (name||'').toUpperCase();
  const cacheKey = (rest||'') + '|' + (deliveryDate||'') + '|' + (name||'') + '|' + area;

  if(_tempByProductKey[cacheKey]){
    return _tempByProductKey[cacheKey];
  }

  if(area === 'PANADERIA'){
    const amb = { tempSalida: 'Ambiente', tempRecepcion: 'Ambiente' };
    _tempByProductKey[cacheKey] = amb;
    return amb;
  }

  let tempSalida = null;

  if(area === 'HELADERIA'){
    if(n.includes('(T)') || n.includes('TUPPER')){
      tempSalida = -21;
    } else {
      const fkey = deliveryDate || 'default';
      if(_tempByDatePoz[fkey] == null){
        _tempByDatePoz[fkey] = -21 - Math.floor(Math.random() * 4);
      }
      tempSalida = _tempByDatePoz[fkey];
    }
  } else if(area === 'PREPARACION'){
    tempSalida = Math.round((1.5 + Math.random() * 2.5) * 10) / 10;
  } else if(area === 'CARNE'){
    tempSalida = Math.round((2 + Math.random() * 1.5) * 10) / 10;
  } else if(area === 'CONGELADOR'){
    tempSalida = Math.round((-18.9 + Math.random() * 0.4) * 10) / 10;
  }

  if(tempSalida == null){
    return { tempSalida: '', tempRecepcion: '' };
  }

  const highDeltaRests = ['AARDE','AUREA','G.E.','LIBRARY','TENCONTEN','METROPOLIS'];
  const delta = highDeltaRests.includes((rest||'').toUpperCase())
    ? Math.round((0.4 + Math.random() * 0.1) * 10) / 10
    : Math.round((0.2 + Math.random() * 0.2) * 10) / 10;
  const tempRecepcion = Math.round((tempSalida + delta) * 10) / 10;

  const result = { tempSalida, tempRecepcion };
  _tempByProductKey[cacheKey] = result;
  return result;
}

function completarTemperaturas(){
  let count = 0;
  state.orders.filter(o => o.status === 'Despachado').forEach(o => {
    o.items.forEach(it => {
      if(it.tempSalida != null && it.tempSalida !== '') return;
      const poz = isAutoLote(it);
      const qty = Number(poz ? it.qty : (it.dispatchedQty || 0));
      if(qty <= 0) return;
      const t = generateTemperatures(it.name, o.rest, it.area, o.deliveryDate);
      it.tempSalida = t.tempSalida;
      it.tempRecepcion = t.tempRecepcion;
      count++;
    });
  });
  saveState();
  state.successMessage = count ? `Temperaturas completadas (${count} ítems).` : 'No había ítems sin temperatura.';
  render();
}

function purgeOlderThanHistory(){
  // Fuera de los últimos 7 días: se elimina de la app (ya debería estar en tu CSV)
  const keepFrom = cutoffDateISO(HISTORIAL_DAYS);
  const before = state.orders.length;
  state.orders = (state.orders||[]).filter(o => {
    if(o.status === 'Pendiente') return true; // pendientes siempre
    const d = o.deliveryDate || ((o.receivedDate||'').split(' ')[0]) || '';
    if(!d) return true;
    return d >= keepFrom;
  });
  return before - state.orders.length;
}

      <button type="button" class="btn-back" onclick="state.dlRest='';state.dlFrom='';state.dlTo='';state.dlProdSearch='';render()">Limpiar</button>
    </div>
  </div>

  <div class="order-card" style="margin-bottom:0.75rem">
    <div class="section-title" style="margin-bottom:0.5rem">📋 DETALLE ALCACHOFAS</div>
    <div style="margin-bottom:0.75rem">
      <button class="btn" style="background:#e2e8f0;color:#1e293b;border:1px solid #cbd5e1" onclick="exportOtrosCSV()">⬇ Descargar</button>
    </div>
    <div class="table-scroll" style="max-height:40vh;overflow:auto">
      <table class="table-module" style="min-width:560px">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Restaurante</th>
            <th>Tipo</th>
            <th>Cant.</th>
            <th>Peso band.</th>
            <th>KG</th>
          </tr>
        </thead>
        <tbody>
          ${alcaF.length===0?`<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:1rem">Sin alcachofas en la app</td></tr>`:
            alcaF.map(r=>`<tr>
              <td style="white-space:nowrap">${fmtD(r.para)}</td>
              <td style="font-weight:700">${r.rest}</td>
              <td style="font-weight:700;font-size:0.72rem">${r.tipo||'—'}</td>
              <td><span class="qty-badge">${r.qty}</span></td>
              <td style="font-size:0.75rem">${r.peso?fmtKg(r.peso):'—'}</td>
              <td style="font-weight:700;color:#166534">${r.kg?fmtKg(r.kg):'—'}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <div class="order-card">
    <div class="section-title" style="margin-bottom:0.5rem">
      <span>📋 DETALLE EXPEDICIÓN</span>
    </div>
    <p style="font-size:0.72rem;color:var(--text-muted);margin:0 0 0.6rem">Elegí hasta qué fecha (inclusive) quieres descargar. Lo posterior queda en la app.</p>
    <div style="display:flex;flex-wrap:wrap;gap:0.6rem;align-items:flex-end;margin-bottom:0.85rem">
      <div class="form-group" style="margin:0">
        <label style="font-size:0.7rem">Archivar hasta esta fecha</label>
        <input type="date" max="2099-12-31" value="${state.archiveUntil||''}" onchange="state.archiveUntil=this.value" style="padding:0.4rem;min-width:150px;border:1px solid var(--text)">
      </div>
      <button class="btn" onclick="exportCSVRange()">⬇ Descargar CSV</button>
      ${(state.pendingArchiveIds&&state.pendingArchiveIds.length)?`<button class="btn" style="background:#b91c1c" onclick="confirmArchiveAfterDownload()">Confirmar archivo (borrar de la app)</button>`:''}
    </div>
    ${(state.pendingArchiveIds&&state.pendingArchiveIds.length)?`<p style="font-size:0.72rem;color:#92400e;background:#fef3c7;padding:0.45rem 0.6rem;border-radius:6px;margin:0 0 0.75rem">CSV generado hasta ${fmtD(state.pendingArchiveUntil||'')}. Si lo <strong>guardaste</strong>, tocá «Confirmar archivo». Si cancelaste la descarga, no toques ese botón.</p>`:''}
    <div class="table-scroll" style="max-height:70vh;overflow:auto">
      <table class="table-module" style="min-width:960px">
        <thead>
          <tr>
            <th>Año</th>
            <th>Mes</th>
            <th>Área</th>
            <th>Fecha exp.</th>
            <th>Restaurante</th>
            <th>Preparaciones</th>
            <th>Lote</th>
            <th>Qty</th>
            <th>T. salida</th>
            <th>T. recepción</th>
          </tr>
        </thead>
        <tbody>
          ${rowsF.length===0?`<tr><td colspan="10" style="text-align:center;color:var(--text-muted);padding:1rem">Sin registros aún</td></tr>`:
            rowsF.map(r=>{
              const anio = r.para ? String(r.para).slice(0,4) : '—';
              const mes = r.para ? mesNombreES(r.para) : '—';
              return `<tr>
              <td style="font-size:0.7rem">${anio}</td>
              <td style="font-size:0.65rem;color:var(--text-muted);white-space:nowrap">${mes}</td>
              <td style="font-size:0.65rem;color:var(--text-muted);white-space:nowrap">${r.area}</td>
              <td style="white-space:nowrap">${fmtD(r.para)}</td>
              <td><strong>${r.rest}</strong></td>
              <td><span class="prod-name">${r.name}</span></td>
              <td style="font-size:0.75rem;color:#0369a1">${r.lote ? fmtD(r.lote) : '—'}</td>
              <td style="font-weight:700;color:var(--success)">${r.qty}</td>
              <td style="font-weight:600;font-size:0.8rem">${r.tempSalida != null && r.tempSalida !== '' ? r.tempSalida : '—'}</td>
              <td style="font-weight:600;font-size:0.8rem">${r.tempRecepcion != null && r.tempRecepcion !== '' ? r.tempRecepcion : '—'}</td>
            </tr>`;
            }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function fmtTempCSV(v){
  if(v == null || v === '') return '';
  if(String(v).toLowerCase() === 'ambiente') return 'Ambiente';
  const n = Number(v);
  if(Number.isNaN(n)) return String(v).replaceAll('"','""');
  return String(Math.round(n * 10) / 10).replace('.', ',');
}
function orderInDateRange(o, from, to){
  const d = o.deliveryDate || '';
  if(!d) return false;
  if(from && d < from) return false;
  if(to && d > to) return false;
  return true;
}
function mesNombreES(ym){
  const meses = ['','ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  const m = parseInt((ym||'').split('-')[1], 10);
  return meses[m] || '';
}
function buildExpedicionCSV(orders){
  // Formato compatible con historial Excel: pegar al final
  let csv = 'AÑO;MES;AREA;FECHA EXP;RESTAURANTE;PREPARACIONES;LOTE;QTY;T.SALIDA;T.RECEPCION;RESPONSABLE\n';
  let lines = 0;
  orders.forEach(o=>{
    const fechaExp = o.deliveryDate || '';
    const anio = fechaExp ? fechaExp.slice(0,4) : '';
    const mes = fechaExp ? mesNombreES(fechaExp) : '';
    o.items.forEach(it=>{
      if(skipAPPCC(it)) return;
      if(!itemMatchesProduct(it, state.dlProdSearch)) return;
      const poz = isAutoLote(it);
      const qtyVal = Number(poz ? it.qty : (it.dispatchedQty || 0));
      if(qtyVal <= 0) return;
      const loteVal = poz ? fmtD(o.deliveryDate) : (it.lote ? fmtD(it.lote) : '');
      const area = getProductArea(it.name, it.area);
      const ts = fmtTempCSV(it.tempSalida);
      const tr = fmtTempCSV(it.tempRecepcion);
      const prod = String(it.name||'').replace(/"/g,'""');
      csv += anio+';'+mes+';'+area+';'+fmtD(fechaExp)+';'+o.rest+';"'+prod+'";'+loteVal+';'+qtyVal+';'+ts+';'+tr+';TRANSPORTE\n';
      lines++;
    });
  });
  return {csv, lines};
}
function downloadCSVFile(csv, filename){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}



function isAlcachofaItem(it){
  return !!(it && (it.name||'').toLowerCase().includes('alcachofa'));
}
function alcachofaTipo(name){
  const n = (name||'').toLowerCase();
  if(n.includes('flor')) return 'FLOR';
  if(n.includes('fondo')) return 'FONDO';
  return 'OTRO';
}
function alcachofaPesoBandeja(name){
  const tipo = alcachofaTipo(name);
  if(tipo === 'FLOR') return 1.25;
  if(tipo === 'FONDO') return 0.75;
  return 0;
}
function fmtKg(n){
  const x = Math.round(Number(n)*100)/100;
  return String(x).replace('.', ',');
}

function exportOtrosCSV(){
  const detailRows = [];
  const resumen = {};
  state.orders.forEach(o => {
    if(state.dlRest && o.rest !== state.dlRest) return;
    if(!matchesDateFilter(o.deliveryDate, state.dlFrom, state.dlTo)) return;
    (o.items||[]).forEach(it => {
      if(!isAlcachofaItem(it)) return;
      if(!itemMatchesProduct(it, state.dlProdSearch)) return;
      const q = o.status === 'Despachado'
        ? (Number(it.dispatchedQty != null ? it.dispatchedQty : it.qty)||0)
        : Number(it.qty)||0;
      if(q <= 0) return;
      const tipo = alcachofaTipo(it.name);
      const peso = alcachofaPesoBandeja(it.name);
      const kg = Math.round(q * peso * 100) / 100;
      detailRows.push({
        fecha: fmtD(o.deliveryDate),
        rest: o.rest,
        tipo, q, peso, kg
      });
      if(!resumen[o.rest]) resumen[o.rest] = { FLOR:{qty:0,kg:0}, FONDO:{qty:0,kg:0}, OTRO:{qty:0,kg:0} };
      const bucket = resumen[o.rest][tipo] || resumen[o.rest].OTRO;
      bucket.qty += q;
      bucket.kg += kg;
    });
  });
  if(detailRows.length === 0){ alert('No hay alcachofas en pantalla.'); return; }

  const summaryRows = [];
  Object.keys(resumen).sort((a,b)=>a.localeCompare(b,'es')).forEach(rest => {
    const r = resumen[rest];
    ['FLOR','FONDO'].forEach(tipo => {
      const b = r[tipo];
      if(!b || (b.qty <= 0 && b.kg <= 0)) return;
      summaryRows.push({
        rest, tipo, q: b.qty, kg: Math.round(b.kg * 100) / 100
      });
    });
  });

  // A-F detalle | G vacía | H-K resumen
  let csv = 'DETALLE PEDIDOS;;;;;;;RESUMEN X TIPO;;;\n';
  csv += 'Fecha;Restaurante;Tipo;Cantidad;Peso bandeja;KG;;Restaurante;Tipo;Cantidad;KG\n';
  const n = Math.max(detailRows.length, summaryRows.length);
  for(let i=0;i<n;i++){
    let left = ';;;;;;;';
    if(i < detailRows.length){
      const d = detailRows[i];
      left = `${d.fecha};${d.rest};${d.tipo};${d.q};${fmtKg(d.peso)};${fmtKg(d.kg)};;`;
    }
    let right = '';
    if(i < summaryRows.length){
      const s = summaryRows[i];
      right = `${s.rest};${s.tipo};${s.q};${fmtKg(s.kg)}`;
    }
    csv += left + right + '\n';
  }

  const stamp = new Date().toISOString().slice(0,10);
  downloadCSVFile(csv, 'ALCACHOFAS_'+stamp+'.csv');
  state.successMessage = 'CSV Alcachofas listo para enviar (detalle + resumen al costado).';
  render();
}

function exportCSVRange(){
  const until = state.archiveUntil || '';
  if(!until){
    alert('Elegí la fecha «Archivar hasta esta fecha» (al lado del botón).\n\nEjemplo: si hoy es 15/08, poné 13/08 para archivar solo hasta el 13 y dejar el 14 y 15 en la app.');
    return;
  }
  // Independiente del filtro de búsqueda: despachado hasta esa fecha y aún no archivado
  const matched = state.orders.filter(o => o.status==='Despachado' && !o.archivedAppcc && o.deliveryDate && o.deliveryDate <= until);
  if(matched.length === 0){
    alert('No hay despachos pendientes de archivar hasta el '+fmtD(until)+'.');
    return;
  }
  // Archivo completo hasta la fecha (sin aplicar el filtro de búsqueda de producto)
  const prevProd = state.dlProdSearch;
  state.dlProdSearch = '';
  const {csv, lines} = buildExpedicionCSV(matched);
  state.dlProdSearch = prevProd;
  if(lines === 0){
    alert('No hay líneas de expedición para exportar.');
    return;
  }
  downloadCSVFile(csv, 'APPCC_hasta_'+until+'.csv');

  // NO se borra aún: el navegador no avisa si cancelás "Guardar como"
  state.pendingArchiveIds = matched.map(o => o.id);
  state.pendingArchiveUntil = until;
  state.pendingArchiveLines = lines;
  state.successMessage = 'CSV generado ('+lines+' líneas). Si lo guardaste, tocá «Confirmar archivo».';
  render();
}
function confirmArchiveAfterDownload(){
  const ids = state.pendingArchiveIds || [];
  if(!ids.length) return;
  const until = state.pendingArchiveUntil || '';
  const idSet = new Set(ids);
  // Marca como archivado en PANEL (ya no se ve ahí). Sigue en transporte/heladería/restaurantes 7 días.
  let marked = 0;
  state.orders.forEach(o => {
    if(idSet.has(o.id)){
      o.archivedAppcc = true;
      marked++;
    }
  });
  // Fuera de 7 días: se borra del todo
  const purged = purgeOlderThanHistory();
  state.pendingArchiveIds = null;
  state.pendingArchiveUntil = '';
  state.pendingArchiveLines = 0;
  saveState();
  let msg = 'Archivado hasta '+fmtD(until)+': '+marked+' pedido(s) ya no se ven en el panel de descargas.';
  if(purged) msg += ' '+purged+' más antiguos de '+HISTORIAL_DAYS+' días eliminados de la app.';
  state.successMessage = msg;
  render();
}

document.addEventListener('change', function(e){
  const el = e.target;
  if(!el || el.type !== 'date' || !el.value) return;
  // Solo corrige cuando la fecha está completa (YYYY-MM-DD)
  const m = el.value.match(/^(\d+)-(\d{2})-(\d{2})$/);
  if(!m) return;
  let y = m[1];
  if(y.length > 4) y = y.slice(0, 4);
  const yi = parseInt(y, 10);
  if(yi > 2099) y = '2099';
  if(y !== m[1]) el.value = y + '-' + m[2] + '-' + m[3];
});

function restoreProdSearchFocus(){
  const map = [
    ['rest-prod-search', 'restProdSearch'],
    ['tr-prod-search', 'transportProdSearch'],
    ['hel-prod-search', 'heladeriaProdSearch'],
    ['dl-prod-search', 'dlProdSearch']
  ];
  for(const [id, key] of map){
    const el = document.getElementById(id);
    if(el && document.activeElement === el) return;
  }
  // if we just typed, re-focus the field that exists
  for(const [id] of map){
    const el = document.getElementById(id);
    if(el && el.value){
      el.focus();
      try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){}
      break;
    }
  }
}
const _render0 = render;
render = function(){
  let activeId = null;
  let selStart = null;
  let selEnd = null;
  const ae = document.activeElement;
  if(ae && ae.id && (ae.id==='rest-prod-search'||ae.id==='tr-prod-search'||ae.id==='hel-prod-search'||ae.id==='dl-prod-search')){
    activeId = ae.id;
    try{ selStart = ae.selectionStart; selEnd = ae.selectionEnd; }catch(e){}
  }
  _render0();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      try{ if(selStart!=null) el.setSelectionRange(selStart, selEnd); }catch(e){}
    }
  }
};

// Marca casilleros de lote en gris al cargar fecha
document.addEventListener('change', function(e){
  const el = e.target;
  if(!el || el.type !== 'date') return;
  if(!el.id || el.id.indexOf('glote-') !== 0) return;
  if(el.disabled){ el.classList.add('lote-filled'); return; }
  el.classList.toggle('lote-filled', !!el.value);
}, true);

initSync().then(function(){ render(); });
</script>
