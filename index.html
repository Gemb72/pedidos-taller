<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma Interna de Pedidos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f8fafc;--card-bg:#ffffff;--text:#1e293b;--text-muted:#64748b;--border:#cbd5e1;--primary:#334155;--primary-hover:#0f172a;--success:#15803d;--danger:#b91c1c;--warning-bg:#fef3c7;--warning-text:#92400e;--radius:6px}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

/* Tipografía base unificada */
body{font-size:0.875rem}
.prod-name,.catalog-item span,.cart-item-name{font-size:0.8rem}
.qty-badge{font-size:0.75rem}
.section-title{font-size:0.7rem}
.order-rest{font-size:0.85rem}
.order-for-date,.order-received{font-size:0.72rem}
/* Pre-check banner */
.precheck-banner{
  display:flex;align-items:center;justify-content:space-between;gap:0.5rem;
  background:#fef3c7;border:1px solid #f59e0b;color:#92400e;
  border-radius:6px;padding:0.45rem 0.65rem;margin-bottom:0.6rem;
  cursor:pointer;font-weight:700;font-size:0.78rem;
}
.precheck-banner:hover{background:#fde68a}
.precheck-banner .pc-count{
  background:#92400e;color:#fff;border-radius:999px;padding:0.1rem 0.45rem;font-size:0.72rem;min-width:1.4rem;text-align:center
}
/* Date inputs compactos en toda la app */
input[type="date"]{font-size:0.8rem;min-height:34px;padding:0.3rem 0.4rem;max-width:100%}

body{background:var(--bg);color:var(--text);min-height:100vh;padding:1rem;display:flex;flex-direction:column;align-items:center}
.container{width:100%;max-width:1150px;margin:0 auto}
.home-header{text-align:center;margin-bottom:1rem;margin-top:0.5rem}
.home-title{font-size:1.25rem;font-weight:700;color:#0f172a;display:flex;align-items:center;justify-content:center;gap:0.4rem;text-transform:uppercase}
.home-subtitle{color:var(--text-muted);font-size:0.8rem;margin-top:0.2rem}
.grid-puestos{display:flex;flex-direction:column;gap:0.5rem;max-width:480px;margin:0 auto}
.card-puesto{background:var(--card-bg);border-radius:var(--radius);padding:0.6rem 0.8rem;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);cursor:pointer;transition:background .15s,border-color .15s}
.card-puesto:hover{background:#f1f5f9;border-color:#94a3b8}

.card-puesto.card-private{
  background:#1e293b;
  border-color:#0f172a;
  color:#f8fafc;
}
.card-puesto.card-private:hover{
  background:#0f172a;
  border-color:#020617;
}
.card-puesto.card-private .card-puesto-info h3{
  color:#f8fafc;
}
.card-puesto.card-private .card-puesto-icon{
  opacity:1;
  filter:none;
}

.card-puesto-left{display:flex;align-items:center;gap:0.8rem}
.card-puesto-icon{font-size:1.2rem;opacity:0.8}
.card-puesto-info h3{font-size:0.85rem;font-weight:700;color:#1e293b;text-transform:uppercase;letter-spacing:.02em}
.card-puesto-info p{font-size:0.75rem;color:var(--text-muted);margin-top:0.1rem}
.badge-count{background:#e2e8f0;color:var(--text);font-weight:700;font-size:0.7rem;padding:0.2rem 0.5rem;border-radius:4px;border:1px solid #cbd5e1;white-space:nowrap}
.badge-count.active{background:var(--warning-bg);color:var(--warning-text);border-color:#fde68a}
.nav-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;border-bottom:1px solid var(--border);padding-bottom:0.5rem}
.btn-back{background:#f1f5f9;border:1px solid var(--border);padding:0.3rem 0.6rem;border-radius:4px;font-weight:600;font-size:0.75rem;cursor:pointer;color:var(--text)}
.btn-back:hover{background:#e2e8f0}
h2{font-size:1.05rem;font-weight:700;color:#0f172a;text-transform:uppercase}
.section-title{font-size:0.75rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:0.5rem}
.order-card{background:var(--card-bg);border-radius:var(--radius);border:1px solid var(--border);padding:1rem;margin-bottom:1rem}
.order-header{display:flex;flex-direction:column;gap:0.2rem;margin-bottom:0.75rem;border-bottom:1px solid #f1f5f9;padding-bottom:0.5rem}
.order-top-line{display:flex;justify-content:space-between;align-items:center}
.order-rest{font-weight:700;font-size:0.9rem;color:#0f172a;text-transform:uppercase}
.order-code{font-weight:700;font-size:0.8rem;color:var(--text-muted);background:#f1f5f9;padding:0.1rem 0.4rem;border-radius:4px;border:1px solid #e2e8f0}
.order-for-date{background:#f1f5f9;padding:0.15rem 0.4rem;border-radius:4px;font-weight:600;font-size:0.75rem;color:#334155;margin-top:0.2rem;display:inline-block;border:1px solid #e2e8f0;width:fit-content}
.order-received{font-size:0.7rem;color:var(--text-muted);margin-top:0.15rem}
.restaurant-filters{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:1rem;padding-right:1.35rem;margin-right:0.35rem}
.restaurant-filter-btn{background:#f1f5f9;border:1px solid var(--border);color:#334155;padding:0.28rem 0.45rem;border-radius:4px;cursor:pointer;font-weight:700;font-size:0.65rem;transition:background .15s,border-color .15s;line-height:1.15}
.restaurant-filter-btn:hover{background:#e2e8f0}
.restaurant-filter-btn.has-pending{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.restaurant-filter-btn.active{background:var(--primary);color:white;border-color:var(--primary)}

.module-tabs{display:flex;gap:0.5rem;margin-bottom:1rem;border-bottom:2px solid var(--border);padding-bottom:0.5rem}
.module-tab-btn{background:#f1f5f9;border:1px solid var(--border);color:var(--text-muted);padding:0.3rem 0.55rem;border-radius:4px;font-weight:700;font-size:0.7rem;cursor:pointer;text-transform:uppercase}
.module-tab-btn.active{background:var(--primary);color:white;border-color:var(--primary)}

.module-tab-btn.tab-confirm{
  background:#fef3c7!important;
  border-color:#f59e0b!important;
  color:#92400e!important;
}
.module-tab-btn.tab-confirm.active{
  background:#f59e0b!important;
  border-color:#d97706!important;
  color:#fff!important;
}
.btn-dividir{
  display:inline-block;font-size:0.62rem;padding:0.2rem 0.45rem;margin-top:4px;
  border:1px solid #f59e0b;background:#fef3c7;border-radius:4px;
  color:#92400e;cursor:pointer;font-weight:700;text-transform:uppercase;
}
.btn-dividir:hover{background:#fde68a}


.table-module{width:100%;border-collapse:collapse;margin-bottom:0.5rem}
.table-module th{text-align:left;font-size:0.65rem;color:var(--text-muted);font-weight:700;padding:0.2rem 0.3rem;background:#f8fafc;border:1px solid var(--border);text-transform:uppercase}
.table-module td{padding:0.25rem 0.3rem;font-size:0.78rem;vertical-align:middle;border:1px solid var(--border)}
.table-module .prod-name{font-size:0.78rem;line-height:1.2}
.lote-pend-cell{display:flex;flex-direction:column;gap:2px;min-width:0}

.lote-pend-cell input[type="date"],
.table-module input[type="date"],
.table-dispatch input[type="date"]{
  direction:rtl;
  text-align:left;
}
.lote-pend-cell input[type="date"]::-webkit-calendar-picker-indicator,
.table-module input[type="date"]::-webkit-calendar-picker-indicator{
  margin-left:0;
  margin-right:auto;
  position:relative;
  left:0;
}

.lote-pend-cell input[type="date"]{font-size:0.7rem;padding:0.15rem 0.25rem;max-width:100%}
.lote-pend-cell label{font-size:0.62rem!important;gap:3px!important;white-space:nowrap}
.category-block{margin-top:0.45rem}
.category-title{font-size:0.72rem;margin:0.35rem 0 0.25rem;padding:0}
.order-card{padding:0.65rem 0.75rem}
.order-header{margin-bottom:0.4rem}
.order-for-date,.order-received{font-size:0.72rem}
.table-module input[type="date"]{width:100%;padding:0.25rem 0.4rem;border:1px solid var(--border);border-radius:4px;font-size:0.75rem;background:#fff}
.table-module input[type="date"]:disabled{background:#e2e8f0;color:#475569;cursor:not-allowed;font-weight:700}
.table-module input[type="date"].lote-filled,
.lote-pend-cell input[type="date"].lote-filled,

.lote-pend-cell input[type="date"]:not(.lote-filled):not(:disabled){
  border-style:dashed;
  border-color:#94a3b8;
  background:#f8fafc;
}
.lote-pend-cell input[type="date"]:not(.lote-filled):not(:disabled)::-webkit-datetime-edit{
  color:#94a3b8;
}

input[type="date"].lote-filled{
  background:#e2e8f0!important;
  color:#334155!important;
  font-weight:700!important;
  border-color:#94a3b8!important;
}

.table-module input:focus{outline:none;border-color:var(--primary)}

.prod-name{font-size:0.8rem;font-weight:600;color:#1e293b}
.qty-badge{background:#f1f5f9;border:1px solid var(--border);padding:0.15rem 0.5rem;border-radius:4px;font-weight:700;font-size:0.8rem;color:#1e293b;min-width:30px;text-align:center;display:inline-block}

.dispatch-qty-container{display:flex;flex-direction:column;align-items:center;gap:0;width:28px}
.dispatch-qty-container button{width:26px;height:14px;border-radius:3px;border:1px solid var(--border);background:#f1f5f9;cursor:pointer;font-weight:700;font-size:0.48rem;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;color:#334155}
.dispatch-qty-container button:hover{background:#e2e8f0}
.dispatch-qty-container input{width:26px;text-align:center;padding:0.05rem 0;border:1px solid var(--border);border-radius:3px;font-weight:700;font-size:0.75rem;margin:1px 0;min-height:0;height:22px;-moz-appearance:textfield}
.dispatch-qty-container input::-webkit-outer-spin-button,
.dispatch-qty-container input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sin-stock-text{font-size:0.75rem;font-weight:700;color:var(--danger);background:#fef2f2;padding:0.15rem 0.4rem;border-radius:4px;border:1px solid #fecaca;display:inline-block}

.cat-sep td{padding:0.15rem 0!important;border:none!important;background:transparent!important}
.cat-sep-line{border-top:1px dashed #cbd5e1;margin:0.15rem 0}
.hold-label{font-size:0.6rem!important;font-weight:700;color:#92400e;cursor:pointer;display:flex;align-items:center;gap:3px;user-select:none;margin:0}
.hold-label input{width:12px!important;height:12px!important;flex-shrink:0}
.table-dispatch .lote-pend-cell input[type="date"]{font-size:0.7rem;padding:0.12rem 0.2rem;min-height:0;height:28px;max-width:130px}
.qty-badge{min-width:24px;padding:0.1rem 0.35rem;font-size:0.75rem}

.lote-auto-label{font-size:0.6rem;color:var(--text-muted);font-weight:700;text-transform:uppercase;display:block;margin-bottom:2px}
.category-block{margin-top:0.75rem}
.category-title{font-weight:700;font-size:0.8rem;color:#1e293b;display:flex;align-items:center;gap:0.3rem;margin-bottom:0.4rem;text-transform:uppercase}
.btn-confirm{width:100%;background:var(--primary);color:white;border:none;padding:0.5rem;border-radius:4px;font-weight:600;font-size:0.8rem;cursor:pointer;margin-top:0.75rem;text-transform:uppercase}
.btn-confirm:hover{background:var(--primary-hover)}

.rest-grid-select{display:grid;grid-template-columns:repeat(3,1fr);gap:0.4rem;margin-bottom:1rem}
.btn-rest-option{background:#f1f5f9;border:1px solid var(--border);padding:0.5rem;border-radius:4px;font-weight:600;color:#334155;cursor:pointer;text-align:center;font-size:0.75rem;transition:background .2s,border-color .2s}
.btn-rest-option:hover{background:#e2e8f0}
.btn-rest-option.selected{background:var(--primary);color:white;border-color:var(--primary)}
.form-group{margin-bottom:0.75rem}
label{display:block;font-size:0.75rem;font-weight:700;margin-bottom:0.25rem;color:#334155;text-transform:uppercase}
input,select{width:100%;padding:0.4rem 0.5rem;border:1px solid var(--border);border-radius:4px;font-size:0.8rem}
.btn{background:var(--primary);color:white;border:none;padding:0.4rem 0.8rem;border-radius:4px;font-weight:600;cursor:pointer;font-size:0.75rem}
.btn:hover{background:var(--primary-hover)}
.catalog-item{display:flex;justify-content:space-between;align-items:center;padding:0.4rem 0;border-bottom:1px solid #f1f5f9}
.catalog-item span{font-size:0.8rem;font-weight:600;color:#1e293b}
.qty-controls{display:flex;align-items:center;gap:0.3rem}
.qty-controls button{width:20px;height:20px;border-radius:3px;border:1px solid var(--border);background:#f1f5f9;cursor:pointer;font-weight:bold;font-size:0.7rem;display:flex;align-items:center;justify-content:center}
.qty-controls input{width:28px;text-align:center;padding:0;border:1px solid var(--border);border-radius:3px;font-weight:600;font-size:0.72rem;height:20px}
.cart-item-row{display:flex;justify-content:space-between;align-items:center;padding:0.4rem 0;border-bottom:1px solid #f1f5f9}
.cart-item-info{display:flex;flex-direction:column;gap:0.1rem}
.cart-item-name{font-size:0.8rem;font-weight:600;color:#1e293b}
.cart-item-area{font-size:0.65rem;color:var(--text-muted);font-weight:700;text-transform:uppercase}
.btn-remove-item{background:transparent;border:none;color:var(--danger);font-size:1rem;cursor:pointer;padding:0 0.2rem;font-weight:bold}
.tabs-sub{display:flex;gap:0.4rem;margin-bottom:0.75rem;border-bottom:1px solid var(--border);padding-bottom:0.4rem}
.tabs-sub button{background:#f1f5f9;border:1px solid transparent;color:#475569;padding:0.25rem 0.45rem;border-radius:4px;cursor:pointer;font-weight:600;font-size:0.7rem;text-transform:uppercase}
.tabs-sub button.active{background:var(--primary);color:white;border-color:var(--primary)}
.success-message{background:#f0fdf4;border:1px solid #86efac;color:#166534;border-radius:6px;padding:0.8rem 1rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;font-size:0.8rem;font-weight:600}
.success-close{background:transparent;border:none;color:#166534;font-size:1.1rem;cursor:pointer;font-weight:700}
.error-message{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:6px;padding:0.8rem 1rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;font-size:0.8rem;font-weight:600}
.error-close{background:transparent;border:none;color:#b91c1c;font-size:1.1rem;cursor:pointer;font-weight:700}

/* Layout restaurantes: 2 cols en PC */

.rest-catalog-scroll{max-height:min(62vh, 520px);overflow:auto;-webkit-overflow-scrolling:touch;padding-right:2px}
.rest-order-layout .order-card:first-child{display:flex;flex-direction:column;min-height:0}
.rest-order-layout .order-card:last-child{position:sticky;top:0.5rem;max-height:calc(100vh - 1rem);overflow:auto}

.rest-order-layout{display:grid;grid-template-columns:2fr 1fr;gap:0.75rem;align-items:start}
.rest-order-layout .order-card:last-child{position:sticky;top:0.5rem}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -0.25rem;padding:0 0.25rem}
.table-scroll .table-module{min-width:560px}


/* Filtros compactos (historial / descargas) */
.filter-bar label{font-size:0.62rem!important;margin-bottom:0.15rem!important;letter-spacing:0.01em}
.filter-bar input[type="date"],
.filter-bar input[type="text"],
.filter-bar select{
  font-size:0.75rem!important;
  min-height:30px!important;
  padding:0.22rem 0.35rem!important;
  max-width:100%;
}
.filter-bar .btn-back{font-size:0.68rem;padding:0.28rem 0.45rem;min-height:30px}
.filter-count{font-size:0.6rem;font-weight:700;opacity:0.9}


/* Números unificados en toda la app */
.qty-badge,
.dispatch-qty-container input,
.qty-controls input,
.table-module td,
.prod-name{
  font-size:0.72rem!important;
}
.qty-badge{
  min-width:22px!important;
  padding:0.08rem 0.3rem!important;
  font-weight:700!important;
}
.dispatch-qty-container{width:26px!important}
.dispatch-qty-container input{
  width:24px!important;
  height:20px!important;
  font-size:0.72rem!important;
  font-weight:700!important;
  min-height:0!important;
  padding:0!important;
}
.dispatch-qty-container button{
  width:24px!important;
  height:13px!important;
  font-size:0.45rem!important;
}
.qty-controls input{
  width:24px!important;
  height:20px!important;
  font-size:0.72rem!important;
}
.qty-controls button{
  width:20px!important;
  height:20px!important;
  font-size:0.65rem!important;
}

/* Filtros aún más compactos */
.filter-bar label,
.order-card label{
  font-size:0.58rem!important;
  margin-bottom:0.12rem!important;
}
.filter-bar input[type="date"],
.filter-bar input[type="text"],
.filter-bar select,
.order-card input[type="date"],
.order-card select{
  font-size:0.72rem!important;
  min-height:28px!important;
  padding:0.18rem 0.3rem!important;
  max-width:130px!important;
}
.filter-bar input[type="text"]{max-width:160px!important}
.section-title{font-size:0.65rem!important}
.restaurant-filter-btn{font-size:0.58rem!important;padding:0.22rem 0.35rem!important}
.module-tab-btn{font-size:0.65rem!important;padding:0.25rem 0.45rem!important}

/* —— MÓVIL / TABLET (prioridad celular) —— */
@media(max-width:900px){
  body{padding:0.5rem}
  .container{max-width:100%}
  .home-title{font-size:1.05rem}
  .home-subtitle{font-size:0.75rem}
  .grid-puestos{max-width:100%}
  .card-puesto{padding:0.85rem 0.9rem;min-height:52px}
  .card-puesto-info h3{font-size:0.9rem}
  .card-puesto-info p{font-size:0.72rem}
  .badge-count{font-size:0.75rem;padding:0.25rem 0.55rem}

  .nav-header{flex-wrap:wrap;gap:0.4rem}
  .btn-back,.btn{padding:0.45rem 0.75rem;font-size:0.8rem;min-height:40px}
  .btn-confirm{padding:0.75rem;font-size:0.9rem;min-height:48px}

  .module-tabs{flex-wrap:wrap;gap:0.3rem;margin-bottom:0.6rem;padding-bottom:0.35rem}
  .module-tab-btn{padding:0.28rem 0.5rem;font-size:0.68rem;min-height:0;line-height:1.2}

  .restaurant-filters{display:grid;grid-template-columns:repeat(3,1fr);gap:0.25rem;padding-right:1.1rem;margin-right:0.25rem}
  .restaurant-filter-btn{width:100%;padding:0.28rem 0.2rem;font-size:0.6rem;min-height:0;text-align:center;line-height:1.1}

  .rest-grid-select{grid-template-columns:repeat(2,1fr)}
  .btn-rest-option{padding:0.5rem 0.35rem;font-size:0.75rem;min-height:0}

  .tabs-sub{flex-wrap:wrap;gap:0.25rem;margin-bottom:0.5rem;padding-bottom:0.3rem}
  .tabs-sub button{padding:0.28rem 0.45rem;min-height:0;font-size:0.68rem}

  .catalog-item{padding:0.28rem 0}
  .qty-controls{gap:0.15rem}
  .qty-controls button{width:20px;height:20px;font-size:0.65rem}
  .qty-controls input{width:24px;height:20px;font-size:0.68rem;padding:0;min-height:0}

  .dispatch-qty-container{width:28px}
  .dispatch-qty-container button{width:26px;height:14px;font-size:0.48rem}
  .dispatch-qty-container input{width:26px;height:20px;font-size:0.7rem;padding:0}

  .table-module{font-size:0.68rem}
  .table-module th,.table-module td{padding:0.15rem 0.2rem}
  .order-card{padding:0.55rem 0.55rem}
  .btn-confirm{padding:0.55rem;margin-top:0.5rem;min-height:0;font-size:0.8rem}

  /* iOS zoom: 16px solo fuera de tablas compactas */
  input[type="date"],input[type="number"],input[type="text"],input[type="password"],select{
    font-size:16px; /* iOS evita zoom */
    min-height:34px;padding:0.3rem 0.4rem
  }
  input[type="date"]{min-height:30px;padding:0.22rem 0.3rem;font-size:16px;max-width:140px}
  .form-group input[type="date"]{max-width:140px}
  .filter-bar input[type="date"],.filter-bar select,.filter-bar input[type="text"]{
    font-size:16px!important;min-height:28px!important;padding:0.15rem 0.25rem!important;max-width:118px
  }
  .filter-bar label,.order-card label{font-size:0.58rem!important}
  .filter-bar .section-title{font-size:0.62rem!important}
  /* números env/cant en móvil: forzar tamaño igual */
  .dispatch-qty-container input,
  .qty-badge,
  .qty-controls input{
    font-size:0.7rem!important;
  }
  .table-module input[type="number"]{
    font-size:0.7rem!important;height:20px!important;min-height:0!important;
  }

  .table-module input[type="date"],
  .table-dispatch input[type="date"],
  .lote-pend-cell input[type="date"]{
    font-size:16px;
    min-height:30px!important;
    height:30px!important;
    padding:0.15rem 0.25rem!important;
    max-width:128px;
  }
  .table-module input[type="number"]{

let sb = null;
let syncReady = false;
let syncTimer = null;
let applyingRemote = false;

function saveState(){
  localStorage.setItem('orders',JSON.stringify(state.orders));
  localStorage.setItem('inventory',JSON.stringify(state.inventory));
  if(sb && syncReady && !applyingRemote){
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushOrdersToCloud, 400);
  }
}

async function pushOrdersToCloud(){
  if(!sb || !syncReady) return;
  try{
    const { error } = await sb.from('registros_pedidos').upsert({
      id: 1,
      orders: state.orders,
      updated_at: new Date().toISOString()
    });
    if(error) console.warn('Sync push:', error.message);
  }catch(e){ console.warn('Sync push fail', e); }
}

async function pullOrdersFromCloud(){
  if(!sb) return;
  try{
    const { data, error } = await sb.from('registros_pedidos').select('orders').eq('id', 1).maybeSingle();
    if(error){ console.warn('Sync pull:', error.message); return; }
    if(data && Array.isArray(data.orders)){
      applyingRemote = true;
      state.orders = data.orders;
      localStorage.setItem('orders', JSON.stringify(state.orders));
      applyingRemote = false;
    }
  }catch(e){ console.warn('Sync pull fail', e); }
}

function fmtD(d){if(!d)return'';const p=d.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d;}
function fmtDT(dt){if(!dt)return'';const p=dt.split(' ');return`${fmtD(p[0])} ${p[1]||''}`.trim();}
function sortNewestFirst(arr){
  return [...arr].sort((a,b)=>{
    // Primero fecha de entrega (más nueva arriba), luego recepción, luego id
    const delA=(a.deliveryDate||'');
    const delB=(b.deliveryDate||'');
    if(delB!==delA) return delB.localeCompare(delA);
    const ra=(a.receivedDate||'');
    const rb=(b.receivedDate||'');
    if(rb!==ra) return rb.localeCompare(ra);
    return String(b.id||'').localeCompare(String(a.id||''));
  });
}
function sortGroupsNewestFirst(groups){
  return [...groups].sort((a,b)=>{
    const delA=(a.deliveryDate||'');
    const delB=(b.deliveryDate||'');
    if(delB!==delA) return delB.localeCompare(delA);
    const ra=String((a.receivedDates&&a.receivedDates[0])||'');
    const rb=String((b.receivedDates&&b.receivedDates[0])||'');
    if(rb!==ra) return rb.localeCompare(ra);
    return 0;
  });
}
const HISTORIAL_DAYS = 7;
function cutoffDateISO(days){
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - days);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function isRecentOrder(o, days){
  if(days == null) days = HISTORIAL_DAYS;
  const cutoff = cutoffDateISO(days);
  const d = o.deliveryDate || ((o.receivedDate||'').split(' ')[0]) || '';
  if(!d) return true; // sin fecha: no ocultar
  return d >= cutoff;
}
function filterRecentHistory(arr, days){
  return (arr||[]).filter(o => isRecentOrder(o, days));
}
const ARCHIVE_REMINDER_DAYS = 8;
function getArchiveReminder(){
  const cutoff = cutoffDateISO(ARCHIVE_REMINDER_DAYS);
  const olds = (state.orders||[]).filter(o => o.status==='Despachado' && o.deliveryDate && o.deliveryDate <= cutoff);
  if(!olds.length) return '';
  const oldest = olds.reduce((m,o) => (!m || o.deliveryDate < m) ? o.deliveryDate : m, '');
  return 'Hay despachos desde el '+fmtD(oldest)+' (hace '+ARCHIVE_REMINDER_DAYS+'+ días) sin archivar. Entrá a APPCC y descargá el CSV.';
}
function isPozzetti(item){return (item.name||'').toLowerCase().includes('(pozzetti)');}
function skipAPPCC(item){
  if(!item) return true;
  if(item.area === 'OTROS') return true;
  const n = (item.name||'').toLowerCase().trim();
  // Pescados de pedido habitual que no entran en registro de expedición
  if(n === 'corvina (c)' || n === 'merluza (c)' || n === 'lubina (c)') return true;
  return false;
}
function isAutoLote(item){
  const n=(item.name||item||'').toLowerCase();
  return n.includes('(pozzetti)') || n.includes('bandeja de rollito');
}
function isAmazonicoHelado(rest, item){return rest === 'AMAZONICO' && item.area === 'HELADOS';}
function isHeladeriaRest(rest){ return !HELADERIA_EXCLUDED.includes(rest); }
function isHeladeriaRelevant(rest, item){
  if(!isHeladeriaRest(rest)) return false;
  if(item.area !== 'HELADOS') return false;
  if(item.heladeriaListo) return false;
  if(rest === 'AMAZONICO') return true;
  return isPozzetti(item);
}
function itemMatchesProduct(item, q){
  const s = (q||'').trim().toLowerCase();
  if(!s) return true;
  return (item.name||'').toLowerCase().includes(s);
}
function orderHasProduct(order, q){
  const s = (q||'').trim().toLowerCase();
  if(!s) return true;
  return (order.items||[]).some(it => (it.name||'').toLowerCase().includes(s));
}
function matchesDateFilter(deliveryDate, from, to){
  if(!deliveryDate) return !(from || to);
  if(from && deliveryDate < from) return false;
  if(to && deliveryDate > to) return false;
  return true;
}

function catalogTabs(cfg){
  const order=['COCINA','HELADOS+','HELADOS','PANADERIA','CARNES','VERDURAS+','BEBIDAS','POSTRES','ALCACHOFAS','OTROS'];
  const keys=Object.keys(cfg.catalog||{});

  keys.forEach(k=>{ if(!tabs.includes(k)) tabs.push(k); });

}

    render();
  } else {
    if(inp){ inp.value=''; inp.placeholder='Contraseña incorrecta'; inp.style.borderColor='var(--danger)'; }

}

  state.view=v;state.successMessage='';state.errorMessage='';

function getPendingCounts(){

  const hel = pend.filter(o => o.items.some(it => isHeladeriaRelevant(o.rest, it))).length;
  return{transporte, heladeria:hel};
}

// ── TRANSPORTE ────────────────────────────────────────
function renderTransporte(){
  if(!checkModuleAuth('TRANSPORTE')){ renderModuleLogin('TRANSPORTE','Módulo TRANSPORTE'); return; }

  const rests=Object.keys(RESTAURANTS_CONFIG);
  const pend=state.orders.filter(o=>o.status==='Pendiente');
  const disp=state.orders.filter(o=>o.status==='Despachado');

  if(state.transportSubTab === 'PENDIENTES' && (!state.transportFilter || !rests.includes(state.transportFilter))){
    const firstWithPend = rests.find(r => pend.some(o => o.rest === r && o.items.some(it => isVisibleInTransport(o.rest, it))));
    state.transportFilter = firstWithPend || rests[0];
  }

  let groupedPending = [];
  if(state.transportSubTab === 'PENDIENTES'){
    const filteredOrders = sortNewestFirst(pend.filter(o => o.rest === state.transportFilter && o.items.some(it => isVisibleInTransport(o.rest, it))));
    const groups = {};
    filteredOrders.forEach(o => {
      const key = `${o.rest}_${o.deliveryDate}_${o.planta||''}`;
      if(!groups[key]){
        groups[key] = {
          rest: o.rest,
          deliveryDate: o.deliveryDate,
          planta: o.planta||'',
          orderIds: [],
          receivedDates: [],
          itemsMap: {}
        };
      }
      groups[key].orderIds.push(o.id);
      groups[key].receivedDates.push(o.receivedDate);
      o.items.forEach(it => {
        if(!isVisibleInTransport(o.rest, it)) return; // no helados Amazónico
        if(!groups[key].itemsMap[it.area]){
          groups[key].itemsMap[it.area] = {};
        }
        if(!groups[key].itemsMap[it.area][it.name]){
          groups[key].itemsMap[it.area][it.name] = { qty: 0, originalItems: [] };
        }
        groups[key].itemsMap[it.area][it.name].qty += Number(it.qty);
        groups[key].itemsMap[it.area][it.name].originalItems.push({ orderId: o.id, qty: it.qty });
      });
    });
    groupedPending = sortGroupsNewestFirst(Object.values(groups).filter(g => Object.keys(g.itemsMap).length > 0));
  }

  let filteredDisp = sortNewestFirst(state.transportFilter ? disp.filter(o => o.rest === state.transportFilter) : disp);
  if(state.transportSubTab === 'HISTORIAL'){
    filteredDisp = filteredDisp.filter(o => matchesDateFilter(o.deliveryDate, state.transportHistFrom, state.transportHistTo) && orderHasProduct(o, state.transportProdSearch));
  }

  // Historial transporte: agrupar rest+fecha(+planta) y sumar mismo producto
  let transportHistGroups = [];
  if(state.transportSubTab === 'HISTORIAL'){
    const map = {};
    filteredDisp.forEach(o => {
      const key = `${o.rest}|${o.deliveryDate||''}|${o.planta||''}`;
      if(!map[key]){
        map[key] = { rest: o.rest, deliveryDate: o.deliveryDate||'', planta: o.planta||'', lines: {} };
      }
      (o.items||[]).forEach(it => {
        if(!itemMatchesProduct(it, state.transportProdSearch)) return;
        const poz = isAutoLote(it);
        const env = Number(poz ? it.qty : (it.dispatchedQty != null ? it.dispatchedQty : 0)) || 0;
        if(env <= 0) return;
        const solic = Number(it.qty) || 0;
        const loteVal = poz ? (o.deliveryDate||'') : (it.lote || '');
        const ik = `${it.area||''}|${it.name}|${loteVal}`;
        if(!map[key].lines[ik]){
          map[key].lines[ik] = { area: it.area||'', name: it.name, solic: 0, env: 0, lote: loteVal, poz };
        }
        map[key].lines[ik].solic += solic;
        map[key].lines[ik].env += env;
      });
    });
    transportHistGroups = Object.values(map)
      .map(g => ({
        rest: g.rest,
        deliveryDate: g.deliveryDate,
        planta: g.planta,
        lines: Object.values(g.lines)
      }))
      .filter(g => g.lines.length > 0);
    transportHistGroups.sort((a,b) => {
      const d = (b.deliveryDate||'').localeCompare(a.deliveryDate||'');
      if(d) return d;
      return (a.rest||'').localeCompare(b.rest||'');
    });
  }

  app.innerHTML=`
  <div class="nav-header">
    <button class="btn-back" onclick="navigateTo('HOME')">← Salir</button>
    <h2>Módulo TRANSPORTE</h2>
  </div>
  <div class="module-tabs">
    <button class="module-tab-btn ${state.transportSubTab==='PENDIENTES'?'active':''}" onclick="switchToTransportTab('PENDIENTES')">Pedidos (${pend.length})</button>
    <button class="module-tab-btn ${state.transportSubTab==='HISTORIAL'?'active':''}" onclick="switchToTransportTab('HISTORIAL')">Historial (${disp.length})</button>
  </div>
  ${state.transportSubTab === 'PENDIENTES' ? `
  <div class="section-title">Filtro de búsqueda</div>
  <div class="restaurant-filters">
    ${rests.map(r=>{
      const match = o => o.rest === r && o.items.some(it => isVisibleInTransport(o.rest, it));
      const hasItems = pend.some(match);
      const count = pend.filter(match).length;
      let btnClass = '';
      if(state.transportFilter === r) btnClass = 'active';
      else if(hasItems) btnClass = 'has-pending';
      return `<button class="restaurant-filter-btn ${btnClass}" onclick="setTransportFilter('${r}')">${r} <span class="filter-count">(${count})</span></button>`;
    }).join('')}
  </div>` : `
  <div class="order-card filter-bar" style="margin-bottom:0.75rem;padding:0.75rem">
    <div class="section-title" style="margin-bottom:0.5rem">Filtro de búsqueda</div>
    <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:flex-end">
      <div class="form-group" style="margin:0">
        <label style="font-size:0.7rem">Restaurante</label>
        <select onchange="setTransportFilter(this.value)" style="padding:0.35rem;border:1px solid var(--border);border-radius:4px;min-width:140px">
          <option value="" ${!state.transportFilter?'selected':''}>TODOS</option>
          ${rests.map(r=>`<option value="${r}" ${state.transportFilter===r?'selected':''}>${r}</option>`).join('')}
        </select>
      </div>
      <div class="form-group" style="margin:0"><label style="font-size:0.7rem">Desde</label><input type="date" max="2099-12-31" value="${state.transportHistFrom||''}" onchange="state.transportHistFrom=this.value;render()" style="padding:0.35rem"></div>
      <div class="form-group" style="margin:0"><label style="font-size:0.7rem">Hasta</label><input type="date" max="2099-12-31" value="${state.transportHistTo||''}" onchange="state.transportHistTo=this.value;render()" style="padding:0.35rem"></div>
      <div class="form-group" style="margin:0;min-width:160px;max-width:240px"><label style="font-size:0.7rem">Producto</label><div style="display:flex;gap:0.25rem;align-items:center"><input type="text" id="tr-prod-search" placeholder="ej. caldo" value="${(state.transportProdSearch||'').replace(/"/g,'&quot;')}" oninput="state.transportProdSearch=this.value;render()" style="padding:0.35rem;width:100%;border:1px solid var(--border);border-radius:4px"><button type="button" class="btn-back" style="padding:0.25rem 0.45rem" onclick="state.transportProdSearch='';render()" title="Limpiar">×</button></div></div>
      <button type="button" class="btn-back" onclick="state.transportFilter='';state.transportProdSearch='';state.transportHistFrom='';state.transportHistTo='';render()">Limpiar</button>
    </div>
  </div>`}
  ${state.successMessage?`<div class="success-message"><div><strong>✓ ${state.successMessage}</strong></div><button class="success-close" onclick="state.successMessage='';render()">×</button></div>`:''}
  ${state.errorMessage?`<div class="error-message"><div><strong>⚠️ Atención:</strong> ${state.errorMessage}</div><button class="error-close" onclick="state.errorMessage='';render()">×</button></div>`:''}

  ${state.transportSubTab === 'PENDIENTES' ? `

    ${groupedPending.length===0?`<div class="order-card"><p style="color:var(--text-muted);font-size:0.8rem">No hay pedidos para este filtro.</p></div>`:''}
    ${groupedPending.map((group, gIdx)=>`
      <div class="order-card" id="group-${gIdx}">
        <div class="order-header">
          <div class="order-top-line">
            <div class="order-rest">${group.rest}</div>

          </div>
          <div class="order-for-date">Para: ${fmtD(group.deliveryDate)}${group.planta? ' · '+group.planta : ''}</div>
          <div class="order-received">Recibidos: ${group.receivedDates.map(dt => fmtDT(dt)||'Reciente').join(' | ')}</div>
        </div>
        ${renderGroupCategoryBlocks(group, gIdx)}
        <button class="btn-confirm" onclick="confirmGroupDispatch(${gIdx})">Confirmar</button>
      </div>`).join('')}
  ` : `
    ${transportHistGroups.length===0?`<div class="order-card"><p style="color:var(--text-muted);font-size:0.8rem">No hay historial de pedidos despachados para este filtro.</p></div>`:''}
    ${transportHistGroups.map(g=>`
      <div class="order-card" style="border-left:4px solid var(--success)">
        <div class="order-header">
          <div class="order-top-line">
            <div class="order-rest">${g.rest}</div>
          </div>
          <div class="order-for-date">Para: ${fmtD(g.deliveryDate)}${g.planta? ' · '+g.planta : ''}</div>
          <div class="order-received">Despachado con éxito</div>
        </div>
        ${renderTransportHistGroupTable(g)}
      </div>`).join('')}
  `}`;
}

function switchToTransportTab(tab){
  state.transportSubTab = tab;
  state.errorMessage = '';
  const rests = Object.keys(RESTAURANTS_CONFIG);
  const pend = state.orders.filter(o => o.status === 'Pendiente');
  if(tab === 'PENDIENTES'){
    const firstWithPend = rests.find(r => pend.some(o => o.rest === r && o.items.some(it => isVisibleInTransport(o.rest, it))));
    state.transportFilter = firstWithPend || rests[0];
  } else {
    state.transportFilter = '';
  }
  render();
}

function setTransportFilter(r){state.transportFilter=r;state.errorMessage='';render();}

function splitKey(gIdx, cat, name){ return gIdx + '|' + cat + '|' + name; }
function getSplitParts(gIdx, cat, name, totalQty){
  const key = splitKey(gIdx, cat, name);
  const parts = state.transportSplits[key];
  if(!parts || !parts.length) return [Number(totalQty)||0];
  const sum = parts.reduce((a,b)=>a+b,0);
  const total = Number(totalQty)||0;
  if(sum !== total){
    // ajustar última parte
    const fixed = parts.slice(0, -1);
    const used = fixed.reduce((a,b)=>a+b,0);
    fixed.push(Math.max(0, total - used));
    state.transportSplits[key] = fixed.filter((p,i)=> p>0 || i===0);
    return state.transportSplits[key].length ? state.transportSplits[key] : [total];
  }
  return parts;
}
function dividirLinea(gIdx, cat, name, totalQty){
  const total = Number(totalQty)||0;
  if(total < 2) return;
  const key = splitKey(gIdx, cat, name);
  let parts = getSplitParts(gIdx, cat, name, total).slice();
  const i = parts.findIndex(p => p > 1);
  if(i < 0) return;
  parts[i] -= 1;
  parts.push(1);
  state.transportSplits[key] = parts;
  render();
}
function renderGroupCategoryBlocks(group, gIdx){
  const cats = ['COCINA','HELADOS','PANADERIA','OTROS'].filter(cat => group.itemsMap[cat] && Object.keys(group.itemsMap[cat]).length);
  if(!cats.length) return '';
  let body = '';
  cats.forEach((cat, cIdx) => {
    const entries = Object.entries(group.itemsMap[cat]);
    const isOtros = cat === 'OTROS';
    if(cIdx > 0){
      body += `<tr class="cat-sep"><td colspan="4"><div class="cat-sep-line"></div></td></tr>`;
    }
    entries.forEach(([name, data], idx) => {
      const poz = isAutoLote(name);
      const totalQty = Number(data.qty)||0;
      const parts = (poz || isOtros) ? [totalQty] : getSplitParts(gIdx, cat, name, totalQty);
      const multi = parts.length > 1;
      parts.forEach((partQty, pIdx) => {
        const idSuffix = multi ? `${idx}-${pIdx}` : `${idx}`;
        const defDesp = partQty;
        const isZero = !poz && Number(defDesp) === 0;
        const safeName = String(name).replace(/'/g,"\\'");
        body += `<tr id="grow-${gIdx}-${cat}-${idSuffix}">
        <td><span class="prod-name">${name}</span>${multi?`<div style="font-size:0.58rem;color:var(--text-muted);font-weight:700">Parte ${pIdx+1}/${parts.length}</div>`:''}${(!poz && !isOtros && totalQty>=2 && pIdx===0)?`<button type="button" class="btn-dividir" onclick="dividirLinea(${gIdx},'${cat}','${safeName}',${totalQty})">✂ Dividir lote</button>`:''}</td>
        <td><span class="qty-badge">${partQty}</span></td>
        <td>
          ${poz ? `<span class="qty-badge" style="background:#e2e8f0">${partQty}</span>
          <input type="hidden" id="gdesp-${gIdx}-${cat}-${idSuffix}" value="${partQty}">` : `
          <div class="dispatch-qty-container" id="gqtybox-${gIdx}-${cat}-${idSuffix}">
            <button type="button" onclick="adjustGroupQty(${gIdx},'${cat}','${idSuffix}',1)" aria-label="más">▲</button>
            <input type="number" min="0" max="${partQty}" inputmode="numeric" pattern="[0-9]*" value="${defDesp}" id="gdesp-${gIdx}-${cat}-${idSuffix}" onfocus="this.select()" oninput="handleGroupQtyInput(this, ${gIdx}, '${cat}', '${idSuffix}')">
            <button type="button" onclick="adjustGroupQty(${gIdx},'${cat}','${idSuffix}',-1)" aria-label="menos">▼</button>
          </div>
          <div id="glss-${gIdx}-${cat}-${idSuffix}" style="margin-top:2px;${isZero?'':'display:none'}"><span class="sin-stock-text">sin stock</span></div>
          <div id="gpend-${gIdx}-${cat}-${idSuffix}" style="margin-top:2px;display:none"><span class="sin-stock-text" style="background:#fef3c7;color:#92400e;border-color:#fde68a">quedará pendiente</span></div>`}
        </td>
        <td>
          ${poz
            ? `<div class="lote-pend-cell">
                <input type="date" max="2099-12-31" value="${group.deliveryDate}" id="glote-${gIdx}-${cat}-${idSuffix}" disabled class="lote-filled">
                <label class="hold-label">
                  <input type="checkbox" id="ghold-${gIdx}-${cat}-${idSuffix}" onchange="toggleHoldPending(${gIdx},'${cat}','${idSuffix}')">
                  Pend.
                </label>
              </div>`
            : isOtros
            ? `<div class="lote-pend-cell">
                <input type="hidden" id="glote-${gIdx}-${cat}-${idSuffix}" value="">
                <label class="hold-label">
                  <input type="checkbox" id="ghold-${gIdx}-${cat}-${idSuffix}" onchange="toggleHoldPending(${gIdx},'${cat}','${idSuffix}')">
                  Pend.
                </label>
              </div>`
            : `<div class="lote-pend-cell">
                <input type="date" max="2099-12-31" value="" id="glote-${gIdx}-${cat}-${idSuffix}" ${isZero ? 'disabled' : ''} onchange="this.classList.toggle('lote-filled', !!this.value)" oninput="this.classList.toggle('lote-filled', !!this.value)">
                <label class="hold-label">
                  <input type="checkbox" id="ghold-${gIdx}-${cat}-${idSuffix}" onchange="toggleHoldPending(${gIdx},'${cat}','${idSuffix}')">
                  Pend.
                </label>
              </div>`}
        </td>
      </tr>`;
      });
    });
  });
  return `<table class="table-module table-dispatch">
    <thead><tr><th style="width:40%">Producto</th><th style="width:10%">Cant.</th><th style="width:12%">Env.</th><th style="width:38%">Lote</th></tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

function renderTransportHistGroupTable(g){
  const cats = ['COCINA','HELADOS','PANADERIA','OTROS'];
  let body = '';
  let first = true;
  cats.forEach(cat => {
    const items = g.lines.filter(i => (i.area||'') === cat);
    if(!items.length) return;
    if(!first) body += `<tr class="cat-sep"><td colspan="4"><div class="cat-sep-line"></div></td></tr>`;
    first = false;
    items.forEach(item => {
      const isOtros = cat === 'OTROS';
      const loteVal = item.lote;
      body += `<tr>
        <td><span class="prod-name">${item.name}</span></td>
        <td><span class="qty-badge">${item.solic}</span></td>
        <td><span class="qty-badge" style="background:#e2e8f0">${item.env}</span></td>
        <td style="font-size:0.75rem;color:#0369a1">${isOtros ? '—' : (loteVal && loteVal!=='No válido' ? fmtD(loteVal) : '—')}</td>
      </tr>`;
    });
  });
  if(!body) return '';
  return `<table class="table-module">
    <thead><tr><th>Producto</th><th>Solic.</th><th>Env.</th><th>Lote</th></tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

function renderCategoryBlocksHistory(order, prodQ){
  const cats = ['COCINA','HELADOS','PANADERIA','OTROS'];
  let body = '';
  let first = true;
  cats.forEach(cat => {
    const items = order.items.filter(i => {
      if(i.area !== cat) return false;
      if(!itemMatchesProduct(i, prodQ)) return false;
      const sent = Number(i.dispatchedQty != null ? i.dispatchedQty : (isAutoLote(i) ? i.qty : 0));
      return sent > 0;
    });
    if(!items.length) return;
    if(!first) body += `<tr class="cat-sep"><td colspan="4"><div class="cat-sep-line"></div></td></tr>`;
    first = false;
    items.forEach(item => {
      const poz = isAutoLote(item);
      const dispQty = poz ? item.qty : item.dispatchedQty;
      const isZero = !poz && Number(dispQty) === 0;
      const isOtros = cat === 'OTROS';
      const loteVal = poz ? order.deliveryDate : (isZero ? 'No válido' : item.lote);
      body += `<tr>
        <td><span class="prod-name">${item.name}</span></td>
        <td><span class="qty-badge">${item.qty}</span></td>
        <td><span class="qty-badge" style="background:#e2e8f0">${dispQty}</span></td>
        <td style="font-size:0.75rem;color:${isZero?'var(--text-muted)':'#0369a1'}">${isOtros ? '—' : (loteVal && loteVal!=='No válido' ? fmtD(loteVal) : '—')}</td>
      </tr>`;
    });
  });
  if(!body) return '';
  return `<table class="table-module">
    <thead><tr><th>Producto</th><th>Solic.</th><th>Env.</th><th>Lote</th></tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}


function adjustGroupQty(gIdx,cat,idx,delta){
  const inp=document.getElementById(`gdesp-${gIdx}-${cat}-${idx}`);
  if(!inp || inp.readOnly)return;
  let v=parseInt(inp.value)||0;v+=delta;if(v<0)v=0;
  inp.value=v;
  updateGroupRowState(inp, gIdx, cat, idx);
}

function handleGroupQtyInput(inp, gIdx, cat, idx){
  if(inp.readOnly) return;
  updateGroupRowState(inp, gIdx, cat, idx);
}

function updateGroupRowState(inp, gIdx, cat, idx){
  const hold = document.getElementById(`ghold-${gIdx}-${cat}-${idx}`);
  const isHold = hold && hold.checked;
  const v = parseInt(inp.value)||0;
  const isZero = (!isHold && v === 0);

  const lbl = document.getElementById(`glss-${gIdx}-${cat}-${idx}`);
  if(lbl) lbl.style.display = isZero ? 'block' : 'none';

  const pendLbl = document.getElementById(`gpend-${gIdx}-${cat}-${idx}`);
  if(pendLbl) pendLbl.style.display = isHold ? 'block' : 'none';

  const loteInp = document.getElementById(`glote-${gIdx}-${cat}-${idx}`);
  if(loteInp){
    if(isHold || isZero){
      loteInp.value = '';
      loteInp.classList.remove('lote-filled');
      loteInp.disabled = true;
      loteInp.placeholder = isHold ? 'Pendiente' : 'No válido';
    } else {
      loteInp.disabled = false;
      loteInp.placeholder = '';
      loteInp.classList.toggle('lote-filled', !!loteInp.value);
    }
  }

  const qtyBox = document.getElementById(`gqtybox-${gIdx}-${cat}-${idx}`);
  if(qtyBox){
    qtyBox.style.opacity = isHold ? '0.4' : '1';
    qtyBox.querySelectorAll('button,input').forEach(el => { el.disabled = isHold; });
  }
}

function toggleHoldPending(gIdx, cat, idx){
  const hold = document.getElementById(`ghold-${gIdx}-${cat}-${idx}`);
  const inp = document.getElementById(`gdesp-${gIdx}-${cat}-${idx}`);
  if(!hold || !inp) return;
  if(hold.checked){
    // keep current qty value for residual later; just lock UI
  }
  updateGroupRowState(inp, gIdx, cat, idx);
}

function buildTransportPendingGroups(restFilter){
  const pend = sortNewestFirst(state.orders.filter(o => o.status==='Pendiente' && o.rest === restFilter && o.items.some(it => isVisibleInTransport(o.rest, it))));
  const groups = {};
  pend.forEach(o => {
    const key = `${o.rest}_${o.deliveryDate}_${o.planta||''}`;
    if(!groups[key]){
      groups[key] = {
        rest: o.rest,
        deliveryDate: o.deliveryDate,
        planta: o.planta||'',
        orderIds: [],
        orders: [],
        itemsMap: {}
      };
    }
    groups[key].orderIds.push(o.id);
    groups[key].orders.push(o);
    o.items.forEach(it => {
      if(!isVisibleInTransport(o.rest, it)) return;
      if(!groups[key].itemsMap[it.area]) groups[key].itemsMap[it.area] = {};
      if(!groups[key].itemsMap[it.area][it.name]) groups[key].itemsMap[it.area][it.name] = { qty: 0 };
      groups[key].itemsMap[it.area][it.name].qty += Number(it.qty);
    });
  });
  return sortGroupsNewestFirst(Object.values(groups).filter(g => Object.keys(g.itemsMap).length > 0));
}

function confirmGroupDispatch(gIdx){
  const uiGroups = buildTransportPendingGroups(state.transportFilter);
  const g = uiGroups[gIdx];
  if(!g) return;
  const groupOrders = g.orders;
  if(!groupOrders || groupOrders.length === 0) return;

  // Mismo orden de ítems que en pantalla (Object.keys del itemsMap de UI)
  const itemsMap = {};
  ['COCINA','HELADOS','PANADERIA','OTROS'].forEach(cat => {
    if(!g.itemsMap[cat]) return;
    itemsMap[cat] = {};
    Object.keys(g.itemsMap[cat]).forEach(name => {
      itemsMap[cat][name] = { totalQty: g.itemsMap[cat][name].qty };
    });
  });

  // Porciones (soporta líneas divididas con lotes distintos)
  const portions = []; // {cat,name,qty,lote,hold}
  let hasError = false;
  const holdBack = {};

  ['COCINA','HELADOS','PANADERIA','OTROS'].forEach(cat=>{
    if(!itemsMap[cat]) return;
    Object.keys(itemsMap[cat]).forEach((name, idx)=>{
      const poz = isAutoLote(name);
      const isOtros = cat === 'OTROS';
      const totalQty = itemsMap[cat][name].totalQty;
      const parts = (poz || isOtros) ? [totalQty] : getSplitParts(gIdx, cat, name, totalQty);
      const multi = parts.length > 1;
      let holdAll = true;
      let anyHold = false;
      parts.forEach((partQty, pIdx) => {
        const idSuffix = multi ? (idx + '-' + pIdx) : String(idx);
        const qi=document.getElementById(`gdesp-${gIdx}-${cat}-${idSuffix}`);
        const li=document.getElementById(`glote-${gIdx}-${cat}-${idSuffix}`);
        const hold=document.getElementById(`ghold-${gIdx}-${cat}-${idSuffix}`);
        const isHold = !!(hold && hold.checked);
        const inputQty = poz ? partQty : (qi ? parseInt(qi.value)||0 : partQty);
        const loteVal = poz ? groupOrders[0].deliveryDate : (li ? li.value : '');
        if(isHold){
          anyHold = true;
          portions.push({cat, name, qty: 0, lote: '', hold: true, partQty});
        } else {
          holdAll = false;
          if(!poz && !isOtros && inputQty > 0 && !loteVal){
            hasError = true;
            if(li) li.style.borderColor = 'var(--danger)';
          }
          portions.push({cat, name, qty: inputQty, lote: loteVal || '', hold: false, partQty});
        }
      });
      if(anyHold){
        // suma de partQty en hold
        const held = portions.filter(p=>p.cat===cat&&p.name===name&&p.hold).reduce((s,p)=>s+(p.partQty||0),0);
        // also remaining of part not fully sent
        holdBack[cat + '||' + name] = (holdBack[cat + '||' + name] || 0);
      }
    });
  });

  // holdBack: for hold parts use partQty; for partial env, residual later
  portions.forEach(p => {
    if(p.hold){
      const k = p.cat + '||' + p.name;
      holdBack[k] = (holdBack[k]||0) + (p.partQty||0);
    }
  });

  if(hasError){
    // No re-render para no perder lo ya cargado; solo aviso visual
    let banner = document.getElementById('dispatch-error-banner');
    if(!banner){
      banner = document.createElement('div');
      banner.id = 'dispatch-error-banner';
      banner.className = 'error-message';
      banner.innerHTML = '<div><strong>⚠️ Atención:</strong> Hay productos con cantidad enviada sin lote. Poné el lote o marcá «Dejar pendiente».</div><button class="error-close" onclick="this.parentElement.remove()">×</button>';
      const card = document.getElementById('group-'+gIdx);
      if(card) card.parentElement.insertBefore(banner, card);
      else document.querySelector('.container').prepend(banner);
    }
    return;
  }

  // Reset dispatched flags
  groupOrders.forEach(order => {
    order.items.forEach(item => {
      item.dispatchedQty = 0;
      item.lote = '';
      item._splitBag = [];
    });
  });

  // Aplicar cada porción (lote distinto posible)
  portions.forEach(p => {
    if(p.hold || p.qty <= 0){
      if(!p.hold && p.qty <= 0){
        // sin stock para esta parte: marcar no válido en items proportional - skip
      }
      return;
    }
    let remaining = p.qty;
    const poz = isAutoLote(p.name);
    groupOrders.forEach(order => {
      order.items.forEach(item => {
        if(remaining <= 0) return;
        if(item.area !== p.cat || item.name !== p.name) return;
        const already = Number(item.dispatchedQty)||0;
        const capacity = Math.max(0, Number(item.qty) - already);
        if(capacity <= 0) return;
        const take = Math.min(capacity, remaining);
        item.dispatchedQty = already + take;
        remaining -= take;
        if(!item._splitBag) item._splitBag = [];
        item._splitBag.push({ qty: take, lote: poz ? order.deliveryDate : p.lote });
        // lote principal = primero; si múltiples, el item se clonará abajo
        if(!item.lote) item.lote = poz ? order.deliveryDate : (p.lote || 'No válido');
      });
    });
  });

  // Si un item tiene varios lotes en _splitBag, partir el item en varios para historial/APPCC
  groupOrders.forEach(order => {
    const newItems = [];
    order.items.forEach(item => {
      const bags = item._splitBag || [];
      if(bags.length <= 1){
        if(bags.length === 1){
          item.dispatchedQty = bags[0].qty;
          item.lote = bags[0].lote;
        }
        delete item._splitBag;
        newItems.push(item);
        return;
      }
      // primer bag actualiza item original parcialmente
      bags.forEach((b, bi) => {
        if(bi === 0){
          item.qty = b.qty; // línea despachada
          item.dispatchedQty = b.qty;
          item.lote = b.lote;
          delete item._splitBag;
          newItems.push(item);
        } else {
          newItems.push({
            name: item.name,
            area: item.area,
            qty: b.qty,
            dispatchedQty: b.qty,
            lote: b.lote
          });
        }
      });
    });
    order.items = newItems;
  });

  // Residual: original total - sum dispatched; hold already in holdBack
  // Recompute residual from itemsMap vs dispatched

  // Asignar temperaturas APPCC a lo despachado (no OTROS)
  // Una sola temperatura por producto+restaurante+fecha (aunque se haya dividido por lote)
  const tempMemo = {};
  groupOrders.forEach(order => {
    order.items.forEach(item => {
      if(skipAPPCC(item)) return;
      const poz = isAutoLote(item);
      const sent = Number(item.dispatchedQty != null ? item.dispatchedQty : (poz ? item.qty : 0));
      if(sent <= 0) return;
      const mk = order.rest + '|' + order.deliveryDate + '|' + item.name;
      if(item.tempSalida != null && item.tempSalida !== ''){
        tempMemo[mk] = { tempSalida: item.tempSalida, tempRecepcion: item.tempRecepcion };
        return;
      }
      if(tempMemo[mk]){
        item.tempSalida = tempMemo[mk].tempSalida;
        item.tempRecepcion = tempMemo[mk].tempRecepcion;
        return;
      }
      const t = generateTemperatures(item.name, order.rest, item.area, order.deliveryDate);
      item.tempSalida = t.tempSalida;
      item.tempRecepcion = t.tempRecepcion;
      tempMemo[mk] = t;
    });
  });

  // Residual: pendientes (hold) + parciales (env < parte). Sin stock (env=0 sin hold) no vuelve.
  const residualItems = [];
  portions.forEach(p => {
    if(isAutoLote(p.name)) return;
    if(p.hold){
      residualItems.push({ name: p.name, qty: p.partQty, area: p.cat });
    } else if(p.qty > 0 && p.qty < p.partQty){
      residualItems.push({ name: p.name, qty: p.partQty - p.qty, area: p.cat });
    }
  });

  // Quitar del historial los ítems que no se enviaron (pendiente o sin stock)
  const keptIds = [];
  groupOrders.forEach(order => {
    order.items = order.items.filter(item => {
      return Number(item.dispatchedQty) > 0;
    });
    if(order.items.length > 0){
      order.status = 'Despachado';
      keptIds.push(order.id);
    } else {
      // Pedido vacío (todo quedó pendiente) → no va al historial
      state.orders = state.orders.filter(o => o.id !== order.id);
    }
  });

  let msg = keptIds.length
    ? `Pedidos de ${groupOrders[0].rest} despachados correctamente.`
    : `Nada despachado de ${groupOrders[0].rest}.`;

  if(residualItems.length > 0){
    // Merge residual by name+area
    const merged = {};
    residualItems.forEach(it => {
      const k = it.area + '||' + it.name;
      if(!merged[k]) merged[k] = { name: it.name, qty: 0, area: it.area };
      merged[k].qty += it.qty;
    });
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const residualOrder = {
      id: 'PED-'+Math.random().toString(36).substr(2,8).toUpperCase(),
      rest: groupOrders[0].rest,
      deliveryDate: groupOrders[0].deliveryDate,
      planta: groupOrders[0].planta||'',
      receivedDate: `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`,
      status: 'Pendiente',
      items: Object.values(merged),
      partialFrom: groupOrders.map(o=>o.id).join(', ')
    };
    state.orders.unshift(residualOrder);
    msg += ` Quedaron pendientes ${residualItems.reduce((s,i)=>s+i.qty,0)} uds. (nuevo pedido generado).`;
  }

  saveState();
  state.errorMessage='';
  state.successMessage = msg;
  render();
}

// ── HELADERÍA ─────────────────────────────────────────
function markHeladeriaDone(orderId){
  const order = state.orders.find(o => o.id === orderId);
  if(!order || order.status !== 'Pendiente') return;

  const relevant = order.items.filter(it => isHeladeriaRelevant(order.rest, it));
  if(relevant.length === 0) return;

  relevant.forEach(it => {
    it.heladeriaListo = true;
    // Amazónico: Heladería cierra el despacho (Transporte no lo ve)
    if(order.rest === 'AMAZONICO'){
      it.dispatchedQty = Number(it.qty);
      it.lote = order.deliveryDate;
      if(it.tempSalida == null || it.tempSalida === ''){
        const t = generateTemperatures(it.name, order.rest, it.area, order.deliveryDate);
        it.tempSalida = t.tempSalida;
        it.tempRecepcion = t.tempRecepcion;
      }
    }
  });

  // Si Amazónico y ya no queda nada pendiente visible para transporte → marcar pedido despachado
  if(order.rest === 'AMAZONICO'){
    const stillPending = order.items.some(it => {
      if(isAmazonicoHelado(order.rest, it)) return false; // ya listos
      return true; // cocina u otros siguen
    });
    // Solo auto-despachar el pedido si SOLO tenía helados (o todos los no-helado ya no existen)
    const onlyHelados = order.items.every(it => it.area === 'HELADOS');
    if(onlyHelados){
      order.status = 'Despachado';
    }
  }

  saveState();
  state.successMessage = `Helados de ${order.rest} marcados como hechos.`;
  render();
}

function renderHeladeria(){
  if(!checkModuleAuth('HELADERIA')){ renderModuleLogin('HELADERIA','Módulo HELADERÍA'); return; }

  const rests=Object.keys(RESTAURANTS_CONFIG).filter(isHeladeriaRest);
  const pend=state.orders.filter(o=>o.status==='Pendiente');
  const disp=state.orders.filter(o=>o.status==='Despachado');
  // Historial heladería: despachados con helados listos O poz/amazonico
  const listos = state.orders.filter(o => o.items.some(it => it.area === 'HELADOS' && it.heladeriaListo));

  if(state.heladeriaSubTab === 'PENDIENTES' && (!state.heladeriaFilter || !rests.includes(state.heladeriaFilter))){
    const firstWithPoz = rests.find(r => pend.some(o => o.rest === r && o.items.some(it => isHeladeriaRelevant(o.rest, it))));
    state.heladeriaFilter = firstWithPoz || rests[0];
  }

  const filteredPendOrders = sortNewestFirst(pend.filter(o => o.rest === state.heladeriaFilter && o.items.some(it => isHeladeriaRelevant(o.rest, it))));
  const histSource = listos.length ? listos : disp;
  let filteredDispOrders = sortNewestFirst(state.heladeriaFilter
    ? histSource.filter(o => o.rest === state.heladeriaFilter && o.items.some(it => it.area === 'HELADOS' && (it.heladeriaListo || isPozzetti(it) || o.rest==='AMAZONICO')))
    : histSource.filter(o => o.items.some(it => it.area === 'HELADOS' && (it.heladeriaListo || isPozzetti(it) || o.rest==='AMAZONICO'))));
  if(state.heladeriaSubTab === 'HISTORIAL'){
    filteredDispOrders = filteredDispOrders.filter(o => matchesDateFilter(o.deliveryDate, state.heladeriaHistFrom, state.heladeriaHistTo) && orderHasProduct(o, state.heladeriaProdSearch));
  }

  // Historial: agrupar por restaurante + fecha de entrega y sumar productos iguales
  let helHistGroups = [];
  if(state.heladeriaSubTab === 'HISTORIAL'){
    const map = {};
    filteredDispOrders.forEach(o => {
      const key = `${o.rest}|${o.deliveryDate||''}`;
      if(!map[key]){
        map[key] = { rest: o.rest, deliveryDate: o.deliveryDate||'', items: {} };
      }
      o.items.forEach(it => {
        if(it.area !== 'HELADOS') return;
        if(!(it.heladeriaListo || isPozzetti(it) || o.rest === 'AMAZONICO')) return;
        if(!itemMatchesProduct(it, state.heladeriaProdSearch)) return;
        const qty = Number(it.dispatchedQty != null ? it.dispatchedQty : it.qty) || 0;
        if(qty <= 0) return;
        const ik = it.name;
        if(!map[key].items[ik]){
          map[key].items[ik] = { name: it.name, qty: 0, lote: it.lote || o.deliveryDate };
        }
        map[key].items[ik].qty += qty;
        // si hay lote distinto, dejamos el de entrega del grupo
        if(!map[key].items[ik].lote) map[key].items[ik].lote = o.deliveryDate;
      });
    });
    helHistGroups = Object.values(map)
      .map(g => ({ ...g, lines: Object.values(g.items) }))
      .filter(g => g.lines.length > 0);
    helHistGroups.sort((a,b) => {
      const d = (b.deliveryDate||'').localeCompare(a.deliveryDate||'');
      if(d) return d;
      return (a.rest||'').localeCompare(b.rest||'');
    });
  }

  function restHelCount(r, listType){
    if(listType === 'PENDIENTES'){
      return pend.filter(o => (!r || o.rest === r) && o.items.some(it => isHeladeriaRelevant(o.rest, it))).length;
    }
    return histSource.filter(o => (!r || o.rest === r) && o.items.some(it => it.area === 'HELADOS' && (it.heladeriaListo || isPozzetti(it) || o.rest==='AMAZONICO'))).length;
  }

  app.innerHTML=`
  <div class="nav-header">
    <button class="btn-back" onclick="navigateTo('HOME')">← Salir</button>
    <h2>Módulo HELADERIA</h2>
  </div>
  ${state.successMessage?`<div class="success-message"><div><strong>✓ ${state.successMessage}</strong></div><button class="success-close" onclick="state.successMessage='';render()">×</button></div>`:''}
  <div class="module-tabs">
    <button class="module-tab-btn ${state.heladeriaSubTab==='PENDIENTES'?'active':''}" onclick="switchToHeladeriaTab('PENDIENTES')">Pedidos</button>
    <button class="module-tab-btn ${state.heladeriaSubTab==='HISTORIAL'?'active':''}" onclick="switchToHeladeriaTab('HISTORIAL')">Historial</button>
  </div>
  ${state.heladeriaSubTab === 'PENDIENTES' ? `
  <div class="section-title">Filtro de búsqueda</div>
  <div class="restaurant-filters">
    ${rests.map(r=>{
      const count = restHelCount(r, 'PENDIENTES');
      const hasPoz = count > 0;
      let btnClass = '';
      if(state.heladeriaFilter === r) btnClass = 'active';
      else if(hasPoz) btnClass = 'has-pending';
      return `<button class="restaurant-filter-btn ${btnClass}" onclick="setHeladeriaFilter('${r}')">${r} <span class="filter-count">(${count})</span></button>`;
    }).join('')}
  </div>` : `
  <div class="order-card filter-bar" style="margin-bottom:0.75rem;padding:0.75rem">
    <div class="section-title" style="margin-bottom:0.5rem">Filtro de búsqueda</div>
    <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:flex-end">
      <div class="form-group" style="margin:0">
        <label style="font-size:0.7rem">Restaurante</label>
        <select onchange="setHeladeriaFilter(this.value)" style="padding:0.35rem;border:1px solid var(--border);border-radius:4px;min-width:140px">
          <option value="" ${!state.heladeriaFilter?'selected':''}>TODOS</option>
          ${rests.map(r=>`<option value="${r}" ${state.heladeriaFilter===r?'selected':''}>${r}</option>`).join('')}
        </select>
      </div>
      <div class="form-group" style="margin:0"><label style="font-size:0.7rem">Desde</label><input type="date" max="2099-12-31" value="${state.heladeriaHistFrom||''}" onchange="state.heladeriaHistFrom=this.value;render()" style="padding:0.35rem"></div>
      <div class="form-group" style="margin:0"><label style="font-size:0.7rem">Hasta</label><input type="date" max="2099-12-31" value="${state.heladeriaHistTo||''}" onchange="state.heladeriaHistTo=this.value;render()" style="padding:0.35rem"></div>
      <div class="form-group" style="margin:0;min-width:160px;max-width:240px"><label style="font-size:0.7rem">Producto</label><div style="display:flex;gap:0.25rem;align-items:center"><input type="text" id="hel-prod-search" placeholder="ej. pozzetti" value="${(state.heladeriaProdSearch||'').replace(/"/g,'&quot;')}" oninput="state.heladeriaProdSearch=this.value;render()" style="padding:0.35rem;width:100%;border:1px solid var(--border);border-radius:4px"><button type="button" class="btn-back" style="padding:0.25rem 0.45rem" onclick="state.heladeriaProdSearch='';render()" title="Limpiar">×</button></div></div>
      <button type="button" class="btn-back" onclick="state.heladeriaFilter='';state.heladeriaProdSearch='';state.heladeriaHistFrom='';state.heladeriaHistTo='';render()">Limpiar</button>

  ${state.heladeriaSubTab === 'PENDIENTES' ? `

    ${filteredPendOrders.map(o=>`

  ` : `

          <div class="order-top-line">

function switchToHeladeriaTab(tab){
  state.heladeriaSubTab = tab;

  const pend = state.orders.filter(o => o.status === 'Pendiente');

function loginRest(){
  const pin=document.getElementById('login-pin').value;
  if(RESTAURANTS_CONFIG[state.selRest]&&RESTAURANTS_CONFIG[state.selRest].code===pin){state.authRest=true;state.cart=[];loadRestDraft(state.selRest);render();}
  else{const inp=document.getElementById('login-pin');inp.value='';inp.placeholder='PIN incorrecto';inp.style.borderColor='var(--danger)';}
}

function restDraftKey(rest){ return 'restDraft_' + (rest || state.selRest || ''); }
function persistRestDraft(){
  try{
    const rest = state.selRest;
    if(!rest) return;
    const payload = {
      cart: state.cart || [],
      deliveryDate: state.deliveryDate || '',
      metropolisPlanta: state.metropolisPlanta || '',
      restOrderPanel: state.restOrderPanel || 'CATALOGO'
    };
    localStorage.setItem(restDraftKey(rest), JSON.stringify(payload));
  }catch(e){}
}
function loadRestDraft(rest){
  try{
    const raw = localStorage.getItem(restDraftKey(rest));
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d && Array.isArray(d.cart) && d.cart.length){
      state.cart = d.cart;
      state.deliveryDate = d.deliveryDate || state.deliveryDate || '';
      state.metropolisPlanta = d.metropolisPlanta || '';
      state.restOrderPanel = d.restOrderPanel || 'CATALOGO';
    }
  }catch(e){}
}
function clearRestDraft(rest){
  try{ localStorage.removeItem(restDraftKey(rest || state.selRest)); }catch(e){}
}

function updateCart(name,delta){
  const area=tabToItemArea(state.activeTab);
  let ci=state.cart.find(c=>c.name===name && c.area===area);
  if(!ci&&delta>0)state.cart.push({name,qty:delta,area});
  else if(ci){ci.qty+=delta;if(ci.qty<=0)state.cart=state.cart.filter(c=>!(c.name===name&&c.area===area));}
  persistRestDraft();
  render();
}
function onCatalogSearch(el){
  state.searchQuery = el.value;
  const pos = el.selectionStart != null ? el.selectionStart : el.value.length;
  render();
  requestAnimationFrame(()=>{
    const s = document.querySelector('input[data-search="catalog"]');
    if(s){
      s.focus();
      try { s.setSelectionRange(pos, pos); } catch(e){}
    }
  });
}
function updateCartOtros(name,delta){
  let ci=state.cart.find(c=>c.name===name && c.area==='OTROS');
  if(!ci&&delta>0)state.cart.push({name,qty:delta,area:'OTROS'});
  else if(ci){ci.qty+=delta;if(ci.qty<=0)state.cart=state.cart.filter(c=>!(c.name===name&&c.area==='OTROS'));}
  persistRestDraft();
  render();
}
function addOtrosItem(){
  const nameInp=document.getElementById('otros-name');
  const qtyInp=document.getElementById('otros-qty');
  const name=(nameInp&&nameInp.value||'').trim();
  let qty=parseInt(qtyInp&&qtyInp.value)||0;
  if(!name){if(nameInp){nameInp.style.borderColor='var(--danger)';nameInp.focus();}return;}
  if(qty<1) qty=1;
  const existing=state.cart.find(c=>c.area==='OTROS'&&c.name.toLowerCase()===name.toLowerCase());
  if(existing) existing.qty+=qty;
  else state.cart.push({name,qty,area:'OTROS'});
  persistRestDraft();
  render();
}
function updateCartItem(name, area, delta){
  let ci = state.cart.find(c => c.name === name && c.area === area);
  if(!ci && delta > 0) state.cart.push({name, qty: delta, area});
  else if(ci){
    ci.qty += delta;
    if(ci.qty <= 0) state.cart = state.cart.filter(c => !(c.name === name && c.area === area));
  }
  persistRestDraft();
  render();
}
function setCartQty(name, area, raw){
  let q = parseInt(raw, 10);
  if(isNaN(q) || q < 0) q = 0;
  let ci = state.cart.find(c => c.name === name && c.area === area);
  if(q <= 0){
    state.cart = state.cart.filter(c => !(c.name === name && c.area === area));
  } else if(ci){
    ci.qty = q;
  } else {
    state.cart.push({name, qty: q, area});
  }
  persistRestDraft();
  render();
}
function setCartQtyFromTab(name, raw){
  const area = tabToItemArea(state.activeTab);
  setCartQty(name, area, raw);
}
function setCartQtyOtros(name, raw){
  setCartQty(name, 'OTROS', raw);
}
function removeFromCart(name, area){
  if(area != null && area !== '') state.cart = state.cart.filter(c => !(c.name === name && c.area === area));
  else state.cart = state.cart.filter(c => c.name !== name);
  persistRestDraft();
  render();
}

function cancelRestOrder(orderId){
  const o = state.orders.find(x => x.id === orderId);
  if(!o) return;
  if(o.status !== 'Pendiente'){
    alert('Solo se pueden anular pedidos que aún no fueron despachados.');
    return;
  }
  if(!confirm('¿Anular este pedido?\nPara: ' + fmtD(o.deliveryDate) + '\nDejará de verse en transporte.')) return;
  o.status = 'Anulado';
  o.cancelledDate = new Date().toISOString();
  saveState();
  state.successMessage = 'Pedido anulado.';
  render();
}
function submitRestOrder(){
  if(!state.deliveryDate){const d=document.querySelector('input[type="date"]');if(d){d.style.borderColor='var(--danger)';d.focus();}return;}
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const newOrder={
    id:'PED-'+Math.random().toString(36).substr(2,8).toUpperCase(),
    rest:state.selRest,deliveryDate:state.deliveryDate,
    receivedDate:`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`,
    status:'Pendiente',items:[...state.cart]
  };
  state.orders.unshift(newOrder);state.cart=[];state.deliveryDate='';state.metropolisPlanta='';state.restOrderPanel='CATALOGO';clearRestDraft(state.selRest);saveState();
  state.authRest=true;
  state.successMessage=`ID: ${newOrder.id}`;
  render();
}

const INVENTORY_MASTER = [

function normalizeName(s){
  return (s||'').toLowerCase().replace(/\s+/g,' ').trim();
}

function getDispatchStats(days){
  const rests = Object.keys(RESTAURANTS_CONFIG);
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - (Number(days)||120));
  const cutoffStr = cutoff.toISOString().slice(0,10);

  const stats = {}; // nameNorm -> { total, byRest: {rest: qty} }

  state.orders.filter(o => o.status === 'Despachado').forEach(o => {
    const d = o.deliveryDate || '';
    if(d < cutoffStr) return;
    o.items.forEach(it => {
      const poz = isAutoLote(it);
      const qty = Number(poz ? it.qty : (it.dispatchedQty || 0));
      if(qty <= 0) return;
      const key = normalizeName(it.name);
      if(!stats[key]) stats[key] = { total: 0, byRest: {} };
      stats[key].total += qty;
      stats[key].byRest[o.rest] = (stats[key].byRest[o.rest] || 0) + qty;
    });
  });
  return stats;
}

function setInventKilos(name, value){
  let v = parseFloat(value);
  if(isNaN(v) || v < 0) v = 0;
  if(v === 0) delete state.inventory[name];
  else state.inventory[name] = v;
  saveState();
  render();
}

function getProductArea(name, itemArea){
  const key = normalizeName(name);
  const found = INVENTORY_MASTER.find(p => normalizeName(p.name) === key);
  if(found) return found.area;
  const n = (name||'').toLowerCase();
  if(itemArea === 'HELADOS' || n.includes('helado') || n.includes('sorbete') || n.includes('pozzetti') || n.includes('tupper')) return 'HELADERIA';
  if(itemArea === 'PANADERIA') return 'PANADERIA';
  if(n.includes('(c)') || n.includes('congel')) return 'CONGELADOR';
  return 'PREPARACION';
}

// Misma lógica que tu macro de Excel
const _tempByDatePoz = {};
const _tempByProductKey = {}; // misma temp si se dividió por lote
function generateTemperatures(name, rest, itemArea, deliveryDate){
  const area = getProductArea(name, itemArea);
  const n = (name||'').toUpperCase();
  const cacheKey = (rest||'') + '|' + (deliveryDate||'') + '|' + (name||'') + '|' + area;

  if(_tempByProductKey[cacheKey]){
    return _tempByProductKey[cacheKey];
  }

  if(area === 'PANADERIA'){
    const amb = { tempSalida: 'Ambiente', tempRecepcion: 'Ambiente' };
    _tempByProductKey[cacheKey] = amb;
    return amb;
  }

  let tempSalida = null;

  if(area === 'HELADERIA'){
    if(n.includes('(T)') || n.includes('TUPPER')){
      tempSalida = -21;
    } else {
      const fkey = deliveryDate || 'default';
      if(_tempByDatePoz[fkey] == null){
        _tempByDatePoz[fkey] = -21 - Math.floor(Math.random() * 4);
      }
      tempSalida = _tempByDatePoz[fkey];
    }
  } else if(area === 'PREPARACION'){
    tempSalida = Math.round((1.5 + Math.random() * 2.5) * 10) / 10;
  } else if(area === 'CARNE'){
    tempSalida = Math.round((2 + Math.random() * 1.5) * 10) / 10;
  } else if(area === 'CONGELADOR'){
    tempSalida = Math.round((-18.9 + Math.random() * 0.4) * 10) / 10;
  }

  if(tempSalida == null){
    return { tempSalida: '', tempRecepcion: '' };
  }

  const highDeltaRests = ['AARDE','AUREA','G.E.','LIBRARY','TENCONTEN','METROPOLIS'];
  const delta = highDeltaRests.includes((rest||'').toUpperCase())
    ? Math.round((0.4 + Math.random() * 0.1) * 10) / 10
    : Math.round((0.2 + Math.random() * 0.2) * 10) / 10;
  const tempRecepcion = Math.round((tempSalida + delta) * 10) / 10;

  const result = { tempSalida, tempRecepcion };
  _tempByProductKey[cacheKey] = result;
  return result;
}

function completarTemperaturas(){
  let count = 0;
  state.orders.filter(o => o.status === 'Despachado').forEach(o => {
    o.items.forEach(it => {
      if(it.tempSalida != null && it.tempSalida !== '') return;
      const poz = isAutoLote(it);
      const qty = Number(poz ? it.qty : (it.dispatchedQty || 0));
      if(qty <= 0) return;
      const t = generateTemperatures(it.name, o.rest, it.area, o.deliveryDate);
      it.tempSalida = t.tempSalida;
      it.tempRecepcion = t.tempRecepcion;
      count++;
    });
  });
  saveState();
  state.successMessage = count ? `Temperaturas completadas (${count} ítems).` : 'No había ítems sin temperatura.';
  render();
}
